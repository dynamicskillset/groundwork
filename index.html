      document.getElementById('capacity').innerHTML = `
        <h2>${t('timeCapacity')}</h2>
        <div class="capacity-summary">
          <span class="capacity-hours">${loggedHours}h</span>
          <span class="capacity-of">${t('of')}
            <span id="weekHoursDisplay" title="${t('weekHoursLabel')}" style="cursor:pointer;border-bottom:1px dashed var(--muted);" tabindex="0" role="button" aria-label="${t('weekHoursLabel')}: ${weekHours}">${weekHours}h</span>
            ${t('available')}
          </span>
          ${overbooked ? `<span class="capacity-warning">${t('overbooked')}</span>` : ''}
        </div>
        ${bars}
        <div style="border-top:1px solid var(--border);margin-top:14px;padding-top:10px;">
          <button class="btn-sm" id="logTimeToggle" aria-expanded="false" aria-controls="logTimeBody" style="width:100%;text-align:left;display:flex;justify-content:space-between;align-items:center;">
            <span>${t('logTime')}</span><span id="logTimeChevron" style="font-size:10px;color:var(--muted);">&#9654;</span>
          </button>
          <div id="logTimeBody" style="display:none;margin-top:10px;">
            <select class="timer-client-select" id="timerClient" aria-label="Select project to log time against">${clientOptions}</select>
            <div class="timer-duration">
              <button class="timer-step-btn" id="timerMinus" aria-label="Decrease time by 15 minutes">&#8722;</button>
              <span class="timer-duration-val" id="timerDurationVal" aria-live="polite" aria-atomic="true">${fmtDuration(timerMinutes)}</span>
              <button class="timer-step-btn" id="timerPlus" aria-label="Increase time by 15 minutes">&#43;</button>
            </div>
            <button class="btn btn-primary" style="width:100%;" id="timerLogBtn" ${!clients.length ? 'disabled' : ''}>${t('logTimeBtn')}</button>
          </div>
        </div>
      `;

      // Week hours — click to edit inline
      const weekHoursEl = document.getElementById('weekHoursDisplay');
      function activateWeekHoursEdit() {
        const currentVal = DATA.capacity.weekHours;
        const input = document.createElement('input');
        input.type = 'number';
        input.min = '1'; input.max = '168';
        input.value = currentVal;
        input.setAttribute('inputmode', 'numeric');
        input.setAttribute('autocomplete', 'off');
        input.setAttribute('aria-label', t('weekHoursLabel'));
        input.style.cssText = 'width:3.5em;padding:1px 4px;background:var(--bg);border:1px solid var(--teal);border-radius:4px;color:var(--text);font-size:inherit;font-weight:inherit;';
        weekHoursEl.replaceWith(input);
        input.focus(); input.select();
        function commit() {
          const val = parseInt(input.value) || currentVal;
          DATA.capacity.weekHours = Math.max(1, Math.min(168, val));
          saveData(DATA);
          renderCapacity();
        }
        input.addEventListener('blur', commit);
        input.addEventListener('keydown', e => {
          if (e.key === 'Enter') { e.preventDefault(); commit(); }
          if (e.key === 'Escape') { renderCapacity(); }
        });
      }
      weekHoursEl.addEventListener('click', activateWeekHoursEdit);
      weekHoursEl.addEventListener('keydown', e => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); activateWeekHoursEdit(); }
      });

      document.getElementById('logTimeToggle').addEventListener('click', () => {
        const body = document.getElementById('logTimeBody');
        const chevron = document.getElementById('logTimeChevron');
        const toggle = document.getElementById('logTimeToggle');
        const open = body.style.display === 'none';
        body.style.display = open ? 'block' : 'none';
        chevron.style.transform = open ? 'rotate(90deg)' : '';
        toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
      });

      document.getElementById('timerClient').addEventListener('change', e => {
        localStorage.setItem('bizdev-timer-client', e.target.value);
      });

      document.getElementById('timerMinus').addEventListener('click', () => {
        if (timerMinutes > 15) {
          timerMinutes -= 15;
          document.getElementById('timerDurationVal').textContent = fmtDuration(timerMinutes);
        }
      });

      document.getElementById('timerPlus').addEventListener('click', () => {
        timerMinutes += 15;
        document.getElementById('timerDurationVal').textContent = fmtDuration(timerMinutes);
      });

      document.getElementById('timerLogBtn').addEventListener('click', () => {
        const client = document.getElementById('timerClient')?.value || '';
        if (!client) return;
        const hoursToAdd = timerMinutes / 60;
        DATA.capacity.loggedHours = Math.round((DATA.capacity.loggedHours + hoursToAdd) * 10) / 10;
        const existing = DATA.capacity.byClient.find(c => c.client === client);
        if (existing) {
          existing.hours = Math.round((existing.hours + hoursToAdd) * 10) / 10;
        } else {
          DATA.capacity.byClient.push({ client, hours: Math.round(hoursToAdd * 10) / 10 });
        }
        saveData(DATA);
        timerMinutes = 60;
        renderCapacity();
        // Keep the log time section expanded after logging
        document.getElementById('logTimeBody').style.display = 'block';
        document.getElementById('logTimeChevron').style.transform = 'rotate(90deg)';
        document.getElementById('logTimeToggle')?.setAttribute('aria-expanded', 'true');
      });
    }

    function fmtDuration(mins) {
      const h = Math.floor(mins / 60);
      const m = mins % 60;
      return h > 0 ? (m > 0 ? `${h}h ${m}m` : `${h}h`) : `${m}m`;
    }

    function renderActions() {
      const items = DATA.actions.map(({ text, tag, urgency }, i) => {
        const dotClass = urgency === 'urgent' ? 'urgent' : urgency === 'amber' ? 'amber' : '';
        const tagClass = urgency === 'urgent' ? 'red' : urgency === 'amber' ? 'amber' : '';
        const urgencyLabel = urgency === 'urgent' ? t('urgentLabel') : urgency === 'amber' ? t('mediumLabel') : t('normalLabel');
        return `
          <div class="action-item">
            <div class="action-dot ${dotClass}" aria-hidden="true"></div>
            <div class="action-text">
              <span class="sr-only">${urgencyLabel}: </span>
              ${escapeHtml(text)}
              ${tag ? `<br><span class="action-tag ${tagClass}">${escapeHtml(tag)}</span>` : ''}
            </div>
            <button class="action-delete" data-index="${i}" aria-label="Delete action">&times;</button>
          </div>
        `;
      }).join('');

      const emptyActions = DATA.actions.length === 0
        ? `<p style="font-size:13px;color:var(--muted);line-height:1.5;">${t('noActionsEmpty')}</p>`
        : '';

      document.getElementById('actions').innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
          <h2 style="margin-bottom:0;">${t('nextActions')}</h2>
          <button class="btn-sm" id="addActionToggle" aria-expanded="false" aria-controls="addActionForm">+ ${t('addAction')}</button>
        </div>
        ${items}
        ${emptyActions}
        <div id="addActionForm" style="display:none;margin-top:12px;border-top:1px solid var(--border);padding-top:12px;">
          <input type="text" id="newActionText" placeholder="${t('actionPlaceholder')}" aria-label="${t('addAction')}" autocomplete="off" style="width:100%;margin-bottom:8px;padding:6px 8px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:13px;">
          <div style="display:flex;gap:8px;">
            <select id="newActionUrgency" aria-label="${t('urgencyLabel')}" style="flex:1;padding:6px 8px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:13px;">
              <option value="normal">${t('normalLabel')}</option>
              <option value="amber">${t('mediumLabel')}</option>
              <option value="urgent">${t('urgentLabel')}</option>
            </select>
            <button class="btn btn-primary" id="addActionSave" style="padding:6px 14px;">${t('addActionBtn')}</button>
          </div>
        </div>
      `;

      document.getElementById('actions').querySelectorAll('.action-delete').forEach(btn => {
        btn.addEventListener('click', () => {
          DATA.actions.splice(parseInt(btn.dataset.index, 10), 1);
          saveData(DATA);
          renderActions();
        });
      });

      document.getElementById('addActionToggle').addEventListener('click', () => {
        const form = document.getElementById('addActionForm');
        const toggle = document.getElementById('addActionToggle');
        const visible = form.style.display !== 'none';
        form.style.display = visible ? 'none' : 'block';
        toggle.setAttribute('aria-expanded', visible ? 'false' : 'true');
        if (!visible) document.getElementById('newActionText').focus();
      });

      function saveNewAction() {
        const text = document.getElementById('newActionText').value.trim();
        if (!text) return;
        DATA.actions.push({ text, tag: '', urgency: document.getElementById('newActionUrgency').value });
        saveData(DATA);
        renderActions();
      }

      document.getElementById('addActionSave').addEventListener('click', saveNewAction);
      document.getElementById('newActionText').addEventListener('keydown', e => {
        if (e.key === 'Enter') { e.preventDefault(); saveNewAction(); }
      });
    }

    function renderChat() {
      const model = getActiveModel();
      const provider = PROVIDERS[model] || PROVIDERS['claude'];
      const hasKey = !!getProviderKey(model);
      const lastUpdate = localStorage.getItem('bizdev-last-update') || '';
      const isDemo = getMode() === 'demo';

      document.getElementById('chat').innerHTML = `
        <div class="chat-panel-header">
          <h2>${t('askProvider')} ${provider.name}</h2>
        </div>
        ${!hasKey ? `
          <div class="chat-setup">
            <p style="font-size:13px;color:var(--muted);margin-bottom:10px;">${t('noApiKey')} ${provider.name}. <a href="#" id="openSettingsFromChat" style="color:var(--teal);">${t('openSettingsLink')}</a> to add one — the rest of the dashboard works without it.</p>
          </div>
        ` : `
          <p class="chat-last-update" id="lastUpdate" aria-live="polite" aria-atomic="true"></p>
          <div class="chat-input-row">
            <textarea id="chatInput" rows="2" placeholder="${t('chatPlaceholder')}" aria-label="${t('chatInputLabel')}"></textarea>
            <button class="btn btn-primary" id="sendBtn">${t('updateBtn')}</button>
          </div>
          <div class="chat-footer">
            <span>${t('poweredBy')} ${provider.name}</span>
            ${lastDataSnapshot ? `<button id="undoBtn" style="background:none;border:none;color:var(--muted);cursor:pointer;font-size:11px;text-decoration:underline;">${t('undoUpdate')}</button>` : ''}
          </div>
        `}
      `;

      if (!hasKey) {
        document.getElementById('openSettingsFromChat').addEventListener('click', e => { e.preventDefault(); openSettings(); });
      } else {
        document.getElementById('sendBtn').addEventListener('click', handleChatUpdate);
        document.getElementById('chatInput').addEventListener('keydown', e => {
          if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleChatUpdate(); }
        });
        document.getElementById('undoBtn')?.addEventListener('click', () => {
          if (!lastDataSnapshot) return;
          DATA = lastDataSnapshot;
          lastDataSnapshot = null;
          localStorage.removeItem('bizdev-last-update');
          saveData(DATA);
          renderAll();
        });
      }

      const luEl = document.getElementById('lastUpdate');
      if (luEl) {
        if (!isDemo && lastUpdate) {
          luEl.textContent = t('lastUpdate') + lastUpdate;
        } else {
          luEl.textContent = t('describeChanges');
        }
      }
    }

    async function handleChatUpdate() {
      const input = document.getElementById('chatInput');
      const sendBtn = document.getElementById('sendBtn');
      const lastUpdateEl = document.getElementById('lastUpdate');
      const userMessage = input.value.trim();

      if (!userMessage) return;

      lastDataSnapshot = JSON.parse(JSON.stringify(DATA)); // save for undo
      input.disabled = true;
      sendBtn.disabled = true;
      sendBtn.innerHTML = `<span class="spinner"></span>${t('updating')}`;
      lastUpdateEl.className = 'chat-last-update';
      lastUpdateEl.textContent = t('thinking');

      const systemPrompt = `You are a data assistant for a freelancer business dashboard. The user describes changes — they may write in any language. You receive their current data as JSON and return the updated JSON — nothing else. No markdown, no code fences, no explanation. Return only the raw JSON object with the same top-level structure. CRITICAL: always return valid JSON regardless of the language the user writes in.

SCHEMA:
- freelancer: { name, role, currency, annualTarget, ytdIncome, vatRegistered, vatRate }
- pipeline: { leads, proposals, active, invoiced, paid } — each is an array of { client, project, value, dayRate, notes }
- income: { months: [string labels], actuals: [number, one per month] }
- capacity: { weekHours, loggedHours, byClient: [{client, hours}] }
- actions: [{ text, tag, urgency }] — urgency is "urgent", "amber", or "normal"

RULES:
1. Moving a pipeline card (e.g. "Shelter is now active") means: find the card by client name in its current column, remove it from there, add it to the target column. Never duplicate a card.
2. Updating a card (e.g. "agreed £3,500 with Shelter") means: find it by client name and update its fields in place.
3. Logging hours (e.g. "did 3 hours on Shelter") means: add to capacity.loggedHours and find or create the matching entry in capacity.byClient.
4. Match client names case-insensitively. Never create a duplicate entry for the same client.
5. If an update is ambiguous, make the most reasonable interpretation.
6. Never remove data that wasn't mentioned. Only change what the user described.
7. Keep all fields that aren't mentioned exactly as they were.
8. String values (names, notes, action text) may be in any language — preserve them as written by the user.`;

      const model = getActiveModel();
      if (!PROVIDERS[model]) return;
      const apiKey = getProviderKey(model);

      if (!apiKey && model !== 'ollama') {
        lastUpdateEl.className = 'chat-last-update error';
        lastUpdateEl.textContent = t('noApiKey') + ' ' + (PROVIDERS[model]?.name || model) + '.';
        input.disabled = false;
        sendBtn.disabled = false;
        sendBtn.textContent = t('updateBtn');
        return;
      }

      let fetchUrl, fetchHeaders, fetchBody, parseResponse;

      if (model === 'claude') {
        fetchUrl = 'https://api.anthropic.com/v1/messages';
        fetchHeaders = {
          'x-api-key': apiKey,
          'anthropic-version': '2023-06-01',
          'content-type': 'application/json',
          'anthropic-dangerous-allow-browser': 'true',
        };
        fetchBody = JSON.stringify({
          model: 'claude-haiku-4-5-20251001',
          max_tokens: 2048,
          system: systemPrompt,
          messages: [{ role: 'user', content: `Current data:\n${JSON.stringify(DATA, null, 2)}\n\nUpdate: ${userMessage}` }],
        });
        parseResponse = r => r.content?.[0]?.text?.trim();
      } else if (model === 'gemini') {
        fetchUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${encodeURIComponent(apiKey)}`;
        fetchHeaders = { 'content-type': 'application/json' };
        fetchBody = JSON.stringify({
          contents: [{ parts: [{ text: systemPrompt + '\n\nCurrent data:\n' + JSON.stringify(DATA, null, 2) + '\n\nUpdate: ' + userMessage }] }],
        });
        parseResponse = r => r.candidates?.[0]?.content?.parts?.[0]?.text?.trim();
      } else {
        if (model === 'ollama') {
          const ollamaBase = (localStorage.getItem('bizdev-ollama-url') || 'http://localhost:11434/v1').replace(/\/$/, '');
          const ollamaModel = localStorage.getItem('bizdev-ollama-model') || 'llama3.2';
          fetchUrl = ollamaBase + '/chat/completions';
          fetchHeaders = { 'content-type': 'application/json' };
          fetchBody = JSON.stringify({
            model: ollamaModel,
            messages: [
              { role: 'system', content: systemPrompt },
              { role: 'user', content: `Current data:\n${JSON.stringify(DATA, null, 2)}\n\nUpdate: ${userMessage}` },
            ],
          });
          parseResponse = r => r.choices?.[0]?.message?.content?.trim();
        } else {
          const urls = { chatgpt: 'https://api.openai.com/v1/chat/completions', mistral: 'https://api.mistral.ai/v1/chat/completions' };
          const models = { chatgpt: 'gpt-4o-mini', mistral: 'mistral-small-latest' };
          fetchUrl = urls[model];
          fetchHeaders = { 'Authorization': `Bearer ${apiKey}`, 'content-type': 'application/json' };
          fetchBody = JSON.stringify({
            model: models[model],
            messages: [
              { role: 'system', content: systemPrompt },
              { role: 'user', content: `Current data:\n${JSON.stringify(DATA, null, 2)}\n\nUpdate: ${userMessage}` },
            ],
          });
          parseResponse = r => r.choices?.[0]?.message?.content?.trim();
        }
      }

      try {
        const response = await fetch(fetchUrl, { method: 'POST', headers: fetchHeaders, body: fetchBody });

        if (!response.ok) {
          const err = await response.json().catch(() => ({}));
          throw new Error(err.error?.message || `API error ${response.status}`);
        }

        const result = await response.json();
        const raw = parseResponse(result);
        if (!raw) throw new Error('Empty response from API — try again.');
        const clean = raw.replace(/^```json?\s*/i, '').replace(/\s*```$/i, '').trim();
        const newData = JSON.parse(clean);

        const requiredKeys = ['freelancer', 'pipeline', 'income', 'capacity', 'actions'];
        if (!requiredKeys.every(k => k in newData)) throw new Error('Unexpected response shape');
        if (!Array.isArray(newData.actions) || !Array.isArray(newData.pipeline?.leads))
          throw new Error('Unexpected response shape');

        DATA = newData;
        const summary = userMessage.length > 60 ? userMessage.slice(0, 57) + '\u2026' : userMessage;
        localStorage.setItem('bizdev-last-update', summary);
        input.value = '';
        renderAll();
        saveData(DATA);

      } catch (err) {
        lastUpdateEl.className = 'chat-last-update error';
        lastUpdateEl.textContent = err.message.includes('JSON')
          ? t('parseError')
          : err.message || t('genericError');

        input.disabled = false;
        sendBtn.disabled = false;
        sendBtn.textContent = t('updateBtn');
        input.focus();
      }
    }

    const PANEL_IDS = ['income', 'capacity', 'actions', 'chat'];

    function applyPanelOrder() {
      const saved = localStorage.getItem('bizdev-panel-order');
      let order;
      try {
        order = saved ? JSON.parse(saved) : PANEL_IDS;
      } catch {
        order = PANEL_IDS;
      }
      // Ensure order only contains valid panel IDs
      order = order.filter(id => PANEL_IDS.includes(id));
      // Add any missing panels at the end
      PANEL_IDS.forEach(id => { if (!order.includes(id)) order.push(id); });

      const main = document.querySelector('main');
      const pipeline = document.getElementById('pipeline');
      // Collect all panels in order
      const panels = order.map(id => document.getElementById(id)).filter(Boolean);
      // Move pipeline to first position (avoids innerHTML clear which destroys listeners)
      main.insertBefore(pipeline, main.firstChild);
      // Appending a node already in the DOM moves it — reorders panels safely
      panels.forEach(el => main.appendChild(el));
    }

    function initPanelOrder() {
      applyPanelOrder();

      PANEL_IDS.forEach(id => {
        const section = document.getElementById(id);
        if (!section) return;

        // Add drag handle if not already present
        if (!section.querySelector('.panel-drag-handle')) {
          const handle = document.createElement('div');
          handle.className = 'panel-drag-handle';
          handle.innerHTML = '&#8942;&#8942;';
          handle.setAttribute('draggable', 'false');
          handle.setAttribute('tabindex', '0');
          handle.setAttribute('role', 'button');
          handle.setAttribute('aria-label', 'Reorder panel — use arrow keys to move up or down');
          handle.addEventListener('keydown', e => {
            if (e.key !== 'ArrowUp' && e.key !== 'ArrowDown') return;
            e.preventDefault();
            const saved = localStorage.getItem('bizdev-panel-order');
            let order;
            try { order = saved ? JSON.parse(saved) : [...PANEL_IDS]; } catch { order = [...PANEL_IDS]; }
            order = order.filter(pid => PANEL_IDS.includes(pid));
            PANEL_IDS.forEach(pid => { if (!order.includes(pid)) order.push(pid); });
            const idx = order.indexOf(id);
            if (idx === -1) return;
            const newIdx = e.key === 'ArrowUp' ? idx - 1 : idx + 1;
            if (newIdx < 0 || newIdx >= order.length) return;
            order.splice(idx, 1);
            order.splice(newIdx, 0, id);
            localStorage.setItem('bizdev-panel-order', JSON.stringify(order));
            applyPanelOrder();
            setTimeout(() => document.querySelector(`#${id} .panel-drag-handle`)?.focus(), 30);
          });
          section.prepend(handle);
        }

        section.setAttribute('draggable', 'true');

        // Skip attaching listeners if already done (prevents duplicates on re-render)
        if (section.dataset.panelListeners === 'true') return;
        section.dataset.panelListeners = 'true';

        section.addEventListener('dragstart', e => {
          e.dataTransfer.setData('panelId', id);
          setTimeout(() => section.classList.add('panel-dragging'), 0);
        });
        section.addEventListener('dragend', () => section.classList.remove('panel-dragging'));
        section.addEventListener('dragover', e => { e.preventDefault(); section.classList.add('panel-drag-over'); });
        section.addEventListener('dragleave', () => section.classList.remove('panel-drag-over'));
        section.addEventListener('drop', e => {
          e.preventDefault();
          section.classList.remove('panel-drag-over');
          const fromId = e.dataTransfer.getData('panelId');
          if (!fromId || fromId === id || fromId === 'pipeline' || !PANEL_IDS.includes(fromId)) return;

          const saved = localStorage.getItem('bizdev-panel-order');
          let order;
          try { order = saved ? JSON.parse(saved) : [...PANEL_IDS]; } catch { order = [...PANEL_IDS]; }
          order = order.filter(pid => PANEL_IDS.includes(pid));
          PANEL_IDS.forEach(pid => { if (!order.includes(pid)) order.push(pid); });

          const fromIdx = order.indexOf(fromId);
          const toIdx = order.indexOf(id);
          if (fromIdx === -1 || toIdx === -1) return;
          order.splice(fromIdx, 1);
          order.splice(toIdx, 0, fromId);
          localStorage.setItem('bizdev-panel-order', JSON.stringify(order));
          applyPanelOrder();
        });
      });
    }

    function getGuideSteps() {
      return [
        { target: null,       title: t('tourWelcomeTitle'),  text: t('tourWelcomeText') },
        { target: 'pipeline', title: t('tourPipelineTitle'), text: t('tourPipelineText') },
        { target: 'income',   title: t('tourIncomeTitle'),   text: t('tourIncomeText') },
        { target: 'capacity', title: t('tourCapacityTitle'), text: t('tourCapacityText') },
        { target: 'chat',     title: t('tourChatTitle'),     text: t('tourChatText') },
        { target: 'header',   title: t('tourModeTitle'),     text: t('tourModeText') },
        { target: null,       title: t('tourReadyTitle'),    text: t('tourReadyText'), isLast: true },
      ];
    }

    function startGuide() {
      let step = 0;
      let overlay, tooltip, highlighted, cleanupGuideFocusFn;

      function cleanup() {
        cleanupGuideFocusFn?.();
        overlay?.remove();
        tooltip?.remove();
        if (highlighted) {
          highlighted.classList.remove('guide-highlighted');
          highlighted = null;
        }
      }

      function showStep() {
        cleanup();
        const GUIDE_STEPS = getGuideSteps();
        const s = GUIDE_STEPS[step];

        overlay = document.createElement('div');
        overlay.className = 'guide-overlay';
        document.body.appendChild(overlay);

        if (s.target) {
          const targetEl = s.target === 'header'
            ? document.querySelector('header')
            : document.getElementById(s.target);
          if (targetEl) {
            highlighted = targetEl;
            highlighted.classList.add('guide-highlighted');
            targetEl.scrollIntoView({ behavior: 'instant', block: 'nearest' });
          }
        }

        tooltip = document.createElement('div');
        tooltip.className = 'guide-tooltip';

        const dontShowHTML = s.isLast
          ? `<label style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);cursor:pointer;margin-bottom:12px;">
              <input type="checkbox" id="guideDontShow"> Don't show again
            </label>`
          : '';

        tooltip.innerHTML = `
          <button class="modal-close" aria-label="Close" id="guideClose">&times;</button>
          <h4></h4>
          <p></p>
          ${dontShowHTML}
          <div class="guide-nav">
            <span class="guide-progress">Step ${step + 1} of ${getGuideSteps().length}</span>
            <div style="display:flex;gap:8px;">
              ${step > 0 ? '<button class="btn-sm" id="guidePrev">Back</button>' : ''}
              <button class="btn btn-primary" id="guideNext">${s.isLast ? 'Done' : 'Next'}</button>
            </div>
          </div>
        `;

        // Set text content safely (no XSS)
        tooltip.querySelector('h4').textContent = s.title;
        tooltip.querySelector('p').textContent = s.text;

        // Position tooltip — keep within viewport, never overlap highlighted element
        if (s.target) {
          const el = s.target === 'header'
            ? document.querySelector('header')
            : document.getElementById(s.target);
          if (el) {
            const rect = el.getBoundingClientRect();
            const TH = 210; // tooltip estimated height
            const TW = 320; // tooltip width
            const GAP = 14;
            const vw = window.innerWidth;
            const vh = window.innerHeight;
            // Available space on each side.
            // rect coords are viewport-relative; tooltip is position:fixed
            // so no scrollY adjustment is needed.
            const spaceBelow = vh - rect.bottom;
            const spaceAbove = rect.top;
            const spaceRight = vw - rect.right;
            const spaceLeft  = rect.left;
            const best = Math.max(spaceBelow, spaceAbove, spaceRight, spaceLeft);

            let top, left;
            if (best === spaceBelow && spaceBelow >= TH + GAP) {
              top  = rect.bottom + GAP;
              left = Math.min(Math.max(8, rect.left), vw - TW - 8);
            } else if (best === spaceAbove && spaceAbove >= TH + GAP) {
              top  = rect.top - TH - GAP;
              left = Math.min(Math.max(8, rect.left), vw - TW - 8);
            } else if (best === spaceRight && spaceRight >= TW + GAP) {
              left = rect.right + GAP;
              top  = Math.min(Math.max(8, rect.top), vh - TH - 8);
            } else if (best === spaceLeft && spaceLeft >= TW + GAP) {
              left = rect.left - TW - GAP;
              top  = Math.min(Math.max(8, rect.top), vh - TH - 8);
            } else {
              // Element fills screen — centre tooltip
              top  = Math.max(8, (vh - TH) / 2);
              left = Math.max(8, (vw - TW) / 2);
            }
            tooltip.style.top  = top + 'px';
            tooltip.style.left = Math.max(8, left) + 'px';
          }
        } else {
          tooltip.style.top = '50%';
          tooltip.style.left = '50%';
          tooltip.style.transform = 'translate(-50%, -50%)';
        }

        document.body.appendChild(tooltip);
        cleanupGuideFocusFn = trapFocus(tooltip, cleanup);

        document.getElementById('guideNext').addEventListener('click', () => {
          if (s.isLast) {
            if (document.getElementById('guideDontShow')?.checked) {
              localStorage.setItem('bizdev-guide-seen', 'true');
            }
            cleanup();
          } else {
            step++;
            showStep();
          }
        });
        document.getElementById('guidePrev')?.addEventListener('click', () => { step--; showStep(); });
        document.getElementById('guideClose').addEventListener('click', cleanup);
        overlay.addEventListener('click', cleanup);
      }

      showStep();
    }

    function maybeShowGuide() {
      if (getMode() === 'demo' && !localStorage.getItem('bizdev-guide-seen')) {
        setTimeout(startGuide, 600);
      }
    }

    function renderAll() {
      renderHeader();
      renderPipeline();
      renderIncome();
      renderCapacity();
      renderActions();
      renderChat();
      initPanelOrder();
      // Keep section aria-labels in sync with current language
      document.getElementById('pipeline')?.setAttribute('aria-label', t('pipeline'));
      document.getElementById('income')?.setAttribute('aria-label', t('income'));
      document.getElementById('capacity')?.setAttribute('aria-label', t('timeCapacity'));
      document.getElementById('actions')?.setAttribute('aria-label', t('nextActions'));
      document.getElementById('chat')?.setAttribute('aria-label', t('tourChatTitle'));
    }

    function init() {
      document.documentElement.lang = getCurrentLang();
      initTheme();
      renderAll();
      initPanelOrder();
      maybeShowGuide();
    }

    init();
  </script>
