<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Groundwork — a dashboard for freelancers</title>
  <meta name="description" content="A personal dashboard for freelancers. Runs in your browser. Keeps your data.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300..700;1,9..40,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #2e3440;
      --surface: #3b4252;
      --border: #4c566a;
      --text: #eceff4;
      --muted: #9bb5cc;
      --teal: #88c0d0;
      --teal-light: #2a3d45;
      --max-width: 720px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }
    nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      background: var(--bg);
      z-index: 10;
    }
    .nav-brand {
      font-weight: 700;
      font-size: 16px;
      color: var(--text);
      text-decoration: none;
      letter-spacing: -0.01em;
    }
    .nav-links { display: flex; gap: 12px; align-items: center; }
    .btn {
      display: inline-block;
      padding: 7px 16px;
      border-radius: 6px;
      font-size: 14px;
      font-family: inherit;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      border: 1px solid transparent;
      transition: opacity 0.15s;
    }
    .btn:hover { opacity: 0.85; }
    .btn-primary { background: var(--teal); color: #2e3440; border-color: var(--teal); }
    .btn-secondary { background: transparent; color: var(--text); border-color: var(--border); }
  </style>
</head>
<body>
  <nav>
    <a class="nav-brand" href="#">Groundwork</a>
    <div class="nav-links">
      <a class="btn btn-secondary" href="https://github.com/dynamicskillset/groundwork" target="_blank" rel="noopener">GitHub</a>
      <a class="btn btn-primary" href="https://github.com/dynamicskillset/groundwork/releases/latest" target="_blank" rel="noopener">Download</a>
    </div>
  </nav>
  <main>
    <section id="hero"><!-- hero --></section>
    <section id="callouts"><!-- callouts --></section>
    <section id="how"><!-- how --></section>
  </main>
  <footer><!-- footer --></footer>
</body>
</html>
