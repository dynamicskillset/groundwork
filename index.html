<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Private, offline-first freelance business dashboard. Track your pipeline, income, and time — no account required, no data sent anywhere.">
  <title>BizDev Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js" integrity="sha384-e6nUZLBkQ86NJ6TVVKAeSaK8jWa3NhkYWZFomE39AvDbQWeie9PlQqM3pmYW5d1g" crossorigin="anonymous"></script>
  <style>
    :root {
      --bg: #2e3440;
      --surface: #3b4252;
      --border: #4c566a;
      --teal: #88c0d0;
      --teal-light: #2a3d45;
      --amber: #ebcb8b;
      --amber-light: #3d3525;
      --text: #eceff4;
      --muted: #81a1c1;
      --danger: #bf616a;
      --danger-bg: #3d2020;
      --danger-bg-hover: #4a2828;
      --shadow: 0 1px 3px rgba(0,0,0,0.3), 0 1px 2px rgba(0,0,0,0.2);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: clamp(13px, 1.3vw, 15px);
      line-height: 1.5;
    }

    #app {
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px 16px;
    }

    header {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 20px 24px;
      margin-bottom: 20px;
      box-shadow: var(--shadow);
    }

    main {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    #pipeline { grid-column: 1 / -1; }

    section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 20px 24px;
      box-shadow: var(--shadow);
    }

    h2 {
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      margin-bottom: 16px;
    }

    h1 {
      font-size: clamp(17px, 2vw, 22px);
      font-weight: 700;
      color: var(--text);
    }

    .meta {
      font-size: 13px;
      color: var(--muted);
      margin-top: 2px;
    }

    .progress-wrap { margin-top: 14px; }
    .progress-label {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      margin-bottom: 6px;
      color: var(--muted);
    }
    .progress-label strong { color: var(--text); }
    .progress-bar {
      height: 8px;
      background: var(--border);
      border-radius: 4px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: var(--teal);
      border-radius: 4px;
      transform-origin: left center;
      transform: scaleX(0);
      transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
      will-change: transform;
    }

    .pipeline-cols {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 12px;
    }
    .pipeline-col {
      background: var(--bg);
      border-radius: 8px;
      padding: 12px;
    }
    .pipeline-col-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 10px;
    }
    .pipeline-col-title {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
    }
    .pipeline-col-value {
      font-size: 13px;
      font-weight: 700;
      color: var(--teal);
    }
    .pipeline-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 10px;
      margin-bottom: 6px;
      font-size: 13px;
    }
    .pipeline-card-name { font-weight: 600; }
    .pipeline-card-type { color: var(--muted); font-size: 12px; }
    .pipeline-card-amount { color: var(--amber); font-weight: 600; font-size: 12px; margin-top: 2px; }

    .income-stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-top: 16px;
    }
    .stat {
      background: var(--bg);
      border-radius: 8px;
      padding: 10px 12px;
    }
    .stat-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
    .stat-value { font-size: clamp(15px, 1.6vw, 20px); font-weight: 700; color: var(--text); margin-top: 2px; }
    .stat-value.teal { color: var(--teal); }

    .income-month-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    .income-month-input label { display: block; font-size: 11px; color: var(--muted); margin-bottom: 3px; }
    .income-month-input input {
      width: 100%;
      padding: 5px 7px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 12px;
    }
    .income-month-input input:focus { outline: 2px solid var(--teal); outline-offset: 1px; }

    .capacity-summary {
      display: flex;
      align-items: baseline;
      gap: 6px;
      margin-bottom: 16px;
    }
    .capacity-hours { font-size: clamp(22px, 2.5vw, 32px); font-weight: 700; color: var(--text); }
    .capacity-of { font-size: 14px; color: var(--muted); }
    .capacity-warning {
      background: var(--danger-bg);
      color: var(--danger);
      border-radius: 4px;
      padding: 2px 8px;
      font-size: 12px;
      font-weight: 600;
      margin-left: auto;
    }
    .client-bar-row { margin-bottom: 10px; }
    .client-bar-label {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      margin-bottom: 4px;
      color: var(--muted);
    }
    .client-bar-label span:first-child { color: var(--text); font-weight: 500; }
    .client-bar-track {
      height: 6px;
      background: var(--border);
      border-radius: 3px;
      overflow: hidden;
    }
    .client-bar-fill {
      height: 100%;
      background: var(--teal);
      border-radius: 3px;
    }

    .action-delete {
      margin-left: auto;
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 16px;
      line-height: 1;
      padding: 6px 8px;
      min-width: 44px;
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.15s;
      flex-shrink: 0;
    }
    .action-item:hover .action-delete,
    .action-delete:focus-visible { opacity: 1; }
    .action-delete:hover { color: var(--danger); }
    .action-item {
      display: flex;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
      align-items: flex-start;
    }
    .action-item:last-child { border-bottom: none; }
    .action-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--teal);
      margin-top: 5px;
      flex-shrink: 0;
    }
    .action-dot.urgent { background: var(--danger); }
    .action-dot.amber { background: var(--amber); }
    .action-text { font-size: 13px; }
    .action-tag {
      display: inline-block;
      font-size: 11px;
      background: var(--teal-light);
      color: var(--teal);
      border-radius: 3px;
      padding: 1px 6px;
      margin-top: 3px;
      font-weight: 600;
    }
    .action-tag.amber { background: var(--amber-light); color: var(--amber); }
    .action-tag.red { background: var(--danger-bg); color: var(--danger); }

    /* Chat panel */
    #chat { display: flex; flex-direction: column; gap: 12px; }

    .chat-setup { display: flex; flex-direction: column; gap: 8px; }
    .chat-setup p { font-size: 12px; color: var(--muted); line-height: 1.4; }
    .chat-setup input {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 13px;
      font-family: inherit;
      background: var(--bg);
      color: var(--text);
    }
    .chat-setup input:focus { outline: 2px solid var(--teal); outline-offset: 1px; }

    .chat-last-update {
      font-size: 12px;
      color: var(--muted);
      min-height: 16px;
      font-style: italic;
    }
    .chat-last-update.error { color: var(--danger); font-style: normal; }

    .chat-input-row {
      display: flex;
      gap: 8px;
      align-items: flex-end;
    }
    .chat-input-row textarea {
      flex: 1;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 13px;
      font-family: inherit;
      resize: none;
      line-height: 1.4;
      background: var(--bg);
      color: var(--text);
    }
    .chat-input-row textarea:focus { outline: 2px solid var(--teal); outline-offset: 1px; }
    .chat-input-row textarea:disabled { opacity: 0.5; }

    .btn {
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      white-space: nowrap;
    }
    .btn-primary { background: var(--teal); color: var(--btn-on-accent, #eceff4); }
    .btn-primary:hover { opacity: 0.9; }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-danger { background: var(--danger); color: var(--danger-text, #fff); }
    .btn-danger:hover { opacity: 0.9; }

    .chat-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: var(--muted);
    }
    .chat-footer button {
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 11px;
      padding: 4px 2px;
      min-height: 44px;
      text-decoration: underline;
    }
    .chat-footer button:hover { color: var(--danger); }

    .chat-panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0;
    }
    .chat-panel-header h2 { margin-bottom: 0; }
    .chat-gear {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--muted);
      font-size: 14px;
      padding: 6px;
      line-height: 1;
      min-width: 44px;
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .chat-gear:hover { color: var(--text); }

    .spinner {
      display: inline-block;
      width: 12px;
      height: 12px;
      border: 2px solid var(--border);
      border-top-color: var(--teal);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 4px;
      will-change: transform;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Header controls */
    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
    }
    .header-identity h1 { margin-bottom: 2px; }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
      padding-top: 2px;
    }

    .mode-pill {
      display: inline-flex;
      align-items: center;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .mode-pill.demo { background: var(--amber-light); color: var(--amber); }
    .mode-pill.live { background: var(--teal-light); color: var(--teal); }

    .btn-sm {
      padding: 4px 10px;
      border: 1px solid var(--border);
      border-radius: 5px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
      background: var(--surface);
      color: var(--text);
      white-space: nowrap;
    }
    .btn-sm:hover { background: var(--bg); }
    .btn-sm.primary { background: var(--teal); color: var(--btn-on-accent, #eceff4); border-color: var(--teal); }
    .btn-sm.primary:hover { opacity: 0.9; }

    .import-input { display: none; }

    /* Settings modal */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 1000;
      display: flex; align-items: center; justify-content: center;
      padding: 20px;
    }
    .modal {
      background: var(--surface);
      border-radius: 12px;
      padding: 28px;
      max-width: 560px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
      position: relative;
    }
    .modal h3 {
      font-size: 16px; font-weight: 700;
      margin-bottom: 20px; color: var(--text);
    }
    .modal-close {
      position: absolute; top: 8px; right: 8px;
      background: none; border: none; font-size: 20px;
      cursor: pointer; color: var(--muted); line-height: 1;
      padding: 8px;
      min-width: 44px; min-height: 44px;
      display: flex; align-items: center; justify-content: center;
    }
    .modal-close:hover { color: var(--text); }
    .provider-card {
      border: 1px solid var(--border);
      border-radius: 8px; padding: 14px 16px;
      margin-bottom: 10px;
    }
    .provider-card.active { border-color: var(--teal); background: var(--teal-light); }
    .provider-header {
      display: flex; align-items: center;
      justify-content: space-between; margin-bottom: 10px;
    }
    .provider-name { font-weight: 600; font-size: 14px; }
    .provider-radio { accent-color: var(--teal); width: 16px; height: 16px; cursor: pointer; }
    .provider-hint { font-size: 11px; color: var(--muted); margin-bottom: 8px; }
    .provider-input-row { display: flex; gap: 8px; }
    .provider-input-row input {
      flex: 1; padding: 7px 10px;
      border: 1px solid var(--border); border-radius: 6px;
      font-size: 13px; font-family: inherit;
      background: var(--bg); color: var(--text);
    }
    .provider-saved { font-size: 11px; color: var(--teal); margin-top: 6px; }

    /* Onboarding modal steps */
    .onboarding-steps {
      display: flex; gap: 6px; margin-bottom: 20px;
    }
    .onboarding-step-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--border);
    }
    .onboarding-step-dot.active { background: var(--teal); }
    .onboarding-step-dot.done { background: var(--teal); opacity: 0.4; }
    .onboarding-field { margin-bottom: 14px; }
    .onboarding-field label {
      display: block; font-size: 12px; font-weight: 600;
      color: var(--muted); margin-bottom: 5px;
      text-transform: uppercase; letter-spacing: 0.04em;
    }
    .onboarding-field input, .onboarding-field select {
      width: 100%; padding: 8px 10px;
      border: 1px solid var(--border); border-radius: 6px;
      font-size: 14px; font-family: inherit;
      background: var(--bg); color: var(--text);
    }
    .onboarding-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
    .onboarding-nav {
      display: flex; justify-content: space-between;
      align-items: center; margin-top: 20px;
    }
    .onboarding-skip { font-size: 12px; color: var(--muted); cursor: pointer; background: none; border: none; }
    .onboarding-skip:hover { color: var(--text); }
    .action-row { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
    .action-row input { flex: 1; }
    .action-row select { width: 110px; }
    .action-row button { background: none; border: none; cursor: pointer; color: var(--muted); font-size: 16px; min-width: 44px; min-height: 44px; }

    /* Pipeline kanban interactions */
    .pipeline-card {
      cursor: grab;
      transition: opacity 0.2s, box-shadow 0.2s;
    }
    .pipeline-card:active { cursor: grabbing; }
    .pipeline-card.dragging { opacity: 0.4; }
    .pipeline-col.drag-over { background: var(--teal-light); outline: 2px dashed var(--teal); }
    .pipeline-add-btn {
      width: 100%; padding: 6px;
      background: none; border: 1px dashed var(--border);
      border-radius: 6px; color: var(--muted);
      font-size: 12px; cursor: pointer; margin-top: 4px;
      font-family: inherit;
    }
    .pipeline-add-btn:hover { border-color: var(--teal); color: var(--teal); }

    /* Pipeline edit modal */
    .pipeline-form .onboarding-field { margin-bottom: 12px; }
    .pipeline-form input, .pipeline-form textarea, .pipeline-form select {
      width: 100%; padding: 8px 10px;
      border: 1px solid var(--border); border-radius: 6px;
      font-size: 13px; font-family: inherit;
      background: var(--bg); color: var(--text);
    }
    .pipeline-form textarea { resize: vertical; min-height: 80px; }
    .pipeline-modal-footer {
      display: flex; justify-content: space-between;
      align-items: center; margin-top: 16px;
    }
    .btn-danger {
      padding: 8px 16px; border: none; border-radius: 6px;
      font-size: 13px; font-weight: 600; cursor: pointer;
      background: var(--danger-bg); color: var(--danger); font-family: inherit;
    }
    .btn-danger:hover { background: var(--danger-bg-hover); }

    /* Time tracker */
    .timer-duration {
      display: flex; align-items: center; justify-content: space-between;
      margin: 10px 0;
    }
    .timer-duration-val {
      font-size: 22px; font-weight: 700; text-align: center; flex: 1;
      color: var(--text);
    }
    .timer-step-btn {
      width: 40px; height: 40px; border-radius: 50%;
      border: 1px solid var(--border); background: var(--bg);
      font-size: 18px; cursor: pointer; line-height: 1;
      display: flex; align-items: center; justify-content: center;
      color: var(--text); flex-shrink: 0;
    }
    .timer-step-btn:hover { background: var(--surface); }
    .timer-client-select {
      width: 100%; padding: 7px 10px; margin-bottom: 10px;
      border: 1px solid var(--border); border-radius: 6px;
      font-size: 13px; font-family: inherit;
      background: var(--bg); color: var(--text);
    }


/* Panel drag handles */
.panel-drag-handle {
  position: absolute; top: 10px; left: 10px;
  color: var(--border); cursor: grab; font-size: 14px;
  opacity: 0; transition: opacity 0.15s;
  user-select: none;
}
section:hover .panel-drag-handle,
section:focus-within .panel-drag-handle { opacity: 1; }
section { position: relative; }
section.panel-dragging { opacity: 0.5; }
section.panel-drag-over { outline: 2px dashed var(--teal); }
.panel-drag-handle:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; border-radius: 3px; opacity: 1; }

/* Getting started guide */
.guide-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.7);
  z-index: 900;
  pointer-events: none;
}
.guide-tooltip {
  position: fixed;
  background: var(--surface);
  border-radius: 10px;
  padding: 20px;
  max-width: 320px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.2);
  z-index: 920;
  pointer-events: all;
}
.guide-tooltip h4 { font-size: 15px; font-weight: 700; margin-bottom: 8px; }
.guide-tooltip p { font-size: 13px; color: var(--muted); line-height: 1.5; margin-bottom: 14px; }
.guide-nav { display: flex; justify-content: space-between; align-items: center; }
.guide-progress { font-size: 11px; color: var(--muted); }
.guide-highlighted {
  position: relative;
  z-index: 910 !important;
  box-shadow: 0 0 0 4px var(--teal), 0 8px 32px rgba(0,0,0,0.2) !important;
  pointer-events: none;
}

/* Theme dots (used in Settings > Appearance) */
.theme-dot {
  width: 24px; height: 24px; border-radius: 50%;
  cursor: pointer; border: 2px solid transparent;
  transition: transform 0.15s ease-out;
}
.theme-dot:hover { transform: scale(1.15); }
.theme-dot.active { border-color: var(--text); }
/* Settings accordion */
.settings-section { border: 1px solid var(--border); border-radius: 8px; margin-bottom: 8px; overflow: hidden; }
.settings-section-header {
  display: flex; justify-content: space-between; align-items: center;
  padding: 12px 16px; cursor: pointer; font-size: 14px; font-weight: 600;
  background: var(--surface); user-select: none;
}
.settings-section-header:hover { background: var(--bg); }
.settings-section-header:focus-visible { outline: 2px solid var(--teal); outline-offset: -2px; }
.settings-chevron { font-size: 11px; color: var(--muted); transition: transform 0.15s; }
.settings-section.open .settings-chevron { transform: rotate(90deg); }
.settings-section-body {
  max-height: 0;
  overflow: hidden;
  padding: 0 16px;
  transition: max-height 0.25s ease-out, padding 0.25s ease-out;
}
.settings-section.open .settings-section-body {
  max-height: 2000px;
  padding: 16px;
  border-top: 1px solid var(--border);
}
.danger-header { color: var(--danger); }

/* Provider test status */
.provider-test-status { font-size: 11px; margin-top: 6px; min-height: 16px; }
.provider-test-status.ok { color: var(--teal); }
.provider-test-status.fail { color: var(--danger); }
.provider-test-status.pending { color: var(--muted); }
.provider-badge {
  font-size: 10px; font-weight: 700; letter-spacing: 0.05em;
  text-transform: uppercase; padding: 2px 6px;
  border-radius: 4px; background: var(--amber-light); color: var(--amber);
  margin-left: 8px;
}

/* Ollama setup guide */
.guide-step {
  display: flex; gap: 12px; margin-bottom: 18px; align-items: flex-start;
}
.guide-step-num {
  width: 24px; height: 24px; border-radius: 50%;
  background: var(--teal); color: var(--btn-on-accent, #eceff4);
  font-size: 12px; font-weight: 700; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
}
.guide-step-body { flex: 1; }
.guide-step-body p { font-size: 13px; color: var(--muted); margin-bottom: 8px; line-height: 1.5; }
.code-block {
  background: var(--bg); border: 1px solid var(--border);
  border-radius: 6px; padding: 8px 12px;
  font-family: monospace; font-size: 12px;
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 6px; gap: 10px;
}
.code-block span { flex: 1; word-break: break-all; }
.copy-btn {
  font-size: 11px; padding: 3px 8px;
  border: 1px solid var(--border); border-radius: 4px;
  background: var(--surface); cursor: pointer; font-family: inherit;
  flex-shrink: 0; white-space: nowrap;
}
.copy-btn:hover { background: var(--bg); }
.copy-btn.copied { color: var(--teal); border-color: var(--teal); }
.provider-card.ollama-card { border-style: dashed; }
.ollama-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
.ollama-fields input {
  padding: 7px 10px; border: 1px solid var(--border); border-radius: 6px;
  font-size: 13px; font-family: inherit;
  background: var(--bg); color: var(--text); width: 100%;
}
.ollama-fields label { font-size: 11px; color: var(--muted); display: block; margin-bottom: 3px; }

/* Skip link */
.skip-link {
  position: absolute;
  top: -100%;
  left: 8px;
  background: var(--teal);
  color: var(--btn-on-accent, #eceff4);
  padding: 8px 16px;
  border-radius: 0 0 6px 6px;
  font-size: 13px;
  font-weight: 600;
  text-decoration: none;
  z-index: 9999;
}
.skip-link:focus { top: 0; }

/* Screen reader only utility */
.sr-only {
  position: absolute;
  width: 1px; height: 1px;
  padding: 0; margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

/* Validation state */
input[aria-invalid="true"],
textarea[aria-invalid="true"] {
  border-color: var(--danger) !important;
  outline: 1px solid var(--danger);
}

/* Inline form errors */
.form-error {
  color: var(--danger);
  font-size: 12px;
  margin-top: 6px;
  display: none;
}
.form-error.visible { display: block; }

/* Focus styles for keyboard navigation */
button:focus-visible,
[role="button"]:focus-visible {
  outline: 2px solid var(--teal);
  outline-offset: 2px;
}

/* Responsive layout */
@media (max-width: 700px) {
  main {
    grid-template-columns: 1fr;
  }
  .header-top {
    flex-wrap: wrap;
  }
  .header-controls {
    flex-wrap: wrap;
  }
  /* Pipeline: horizontal scroll with snap on mobile */
  .pipeline-cols {
    display: flex;
    flex-direction: row;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    gap: 12px;
    padding-bottom: 8px;
    -webkit-overflow-scrolling: touch;
  }
  .pipeline-col {
    min-width: 240px;
    width: 240px;
    flex-shrink: 0;
    scroll-snap-align: start;
  }
  /* Scroll hint indicator */
  #pipeline::after {
    content: '← swipe →';
    display: block;
    font-size: 11px;
    color: var(--muted);
    text-align: center;
    margin-top: 6px;
    letter-spacing: 0.04em;
  }
}

/* Reduced motion */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
}

    function getMode() {
      return localStorage.getItem('bizdev-mode') || 'demo';

    function loadData() {
      try {
        const saved = localStorage.getItem(storageKey());
        if (!saved) return JSON.parse(JSON.stringify(DEFAULT_DATA));
        const data = JSON.parse(saved);
        // Migrate: ensure pipeline has all columns
        if (data.pipeline && !Array.isArray(data.pipeline.paid)) {
          data.pipeline.paid = [];
        }
        return data;
      } catch {
        return JSON.parse(JSON.stringify(DEFAULT_DATA));
      }
    }

    function saveData(data) {
      try {
        localStorage.setItem(storageKey(), JSON.stringify(data));
      } catch (e) {
        if (e.name === 'QuotaExceededError' || e.name === 'NS_ERROR_DOM_QUOTA_REACHED') {
          console.warn('BizDev Dashboard: localStorage quota exceeded — data not saved.');

    function accentNeedsDarkText(hex) {
      // Returns true if the accent color is light enough to need dark text
      const r = parseInt(hex.slice(1, 3), 16);
      const g = parseInt(hex.slice(3, 5), 16);
      const b = parseInt(hex.slice(5, 7), 16);
      // Relative luminance (simplified)
      const luminance = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
      return luminance > 0.55;
    }

    function applyAccent(color) {
      const accent = ACCENT_COLORS.find(a => a.color === color) || ACCENT_COLORS[0];
      const r = document.documentElement.style;
      r.setProperty('--teal', accent.color);
      r.setProperty('--teal-light', accent.light);
      // Ensure button text is legible against the accent background
      r.setProperty('--btn-on-accent', accentNeedsDarkText(accent.color) ? '#2e3440' : '#eceff4');
      localStorage.setItem('bizdev-accent', color);
      if (incomeChart) { incomeChart.destroy(); incomeChart = null; }
      if (document.getElementById('income')?.querySelector('canvas')) {

    async function testProviderKey(id, statusEl) {
      if (!statusEl) return;
      const apiKey = getProviderKey(id);
      if (!apiKey && id !== 'ollama') {
        statusEl.className = 'provider-test-status fail';
        statusEl.textContent = '✗ No key saved yet';
        return;
      }

      statusEl.className = 'provider-test-status pending';
      statusEl.textContent = 'Testing…';

      try {
        let url, headers, body;

        if (id === 'claude') {
          url = 'https://api.anthropic.com/v1/messages';
          headers = {
            'x-api-key': apiKey,
            'anthropic-version': '2023-06-01',
            'content-type': 'application/json',
            'anthropic-dangerous-allow-browser': 'true',
          };
          body = JSON.stringify({ model: 'claude-haiku-4-5-20251001', max_tokens: 1, messages: [{ role: 'user', content: 'hi' }] });
        } else if (id === 'gemini') {
          url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${encodeURIComponent(apiKey)}`;
          headers = { 'content-type': 'application/json' };
          body = JSON.stringify({ contents: [{ parts: [{ text: 'hi' }] }] });
        } else if (id === 'ollama') {
          const ollamaUrl = localStorage.getItem('bizdev-ollama-url') || 'http://localhost:11434/v1';
          const ollamaModel = localStorage.getItem('bizdev-ollama-model') || 'llama3.2';
          url = ollamaUrl.replace(/\/$/, '') + '/chat/completions';
          headers = { 'content-type': 'application/json' };
          body = JSON.stringify({ model: ollamaModel, max_tokens: 1, messages: [{ role: 'user', content: 'hi' }] });
        } else {
          const urls = { chatgpt: 'https://api.openai.com/v1/chat/completions', mistral: 'https://api.mistral.ai/v1/chat/completions' };
          const models = { chatgpt: 'gpt-4o-mini', mistral: 'mistral-small-latest' };
          url = urls[id];
          headers = { 'Authorization': `Bearer ${apiKey}`, 'content-type': 'application/json' };
          body = JSON.stringify({ model: models[id], max_tokens: 1, messages: [{ role: 'user', content: 'hi' }] });
        }

        const res = await fetch(url, { method: 'POST', headers, body });
        if (res.ok || res.status === 400) {
          statusEl.className = 'provider-test-status ok';
          statusEl.textContent = '✓ Connected';
        } else {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.error?.message || `HTTP ${res.status}`);
        }
      } catch (e) {
        statusEl.className = 'provider-test-status fail';
        statusEl.textContent = `✗ ${e.message.length > 60 ? e.message.slice(0, 57) + '…' : e.message}`;
      }
    }

  if (!slot) return;
  const isActive = getActiveModel() === 'ollama';
  const savedUrl = localStorage.getItem('bizdev-ollama-url') || 'http://localhost:11434/v1';
  const savedModel = localStorage.getItem('bizdev-ollama-model') || 'llama3.2';

  slot.innerHTML = `

        <span class="provider-name">Ollama <span class="provider-badge">Local &middot; Advanced</span></span>

        </div>
        <div>
          <label for="ollama-model">Model</label>

        </div>
      </div>
      <div style="display:flex;gap:8px;margin-bottom:6px;">
        <button class="btn-sm" id="ollama-guide-btn">Setup guide &rarr;</button>
        <button class="btn-sm" id="ollama-test-btn">Test</button>
        <button class="btn btn-primary" id="ollama-save-btn">Save</button>
      </div>
      <div class="provider-test-status" id="status-ollama"></div>
    </div>
  `;

  // Set field values safely via DOM
  document.getElementById('ollama-url').value = savedUrl;
  document.getElementById('ollama-model').value = savedModel;

  // Active model radio — in-place update (same pattern as cloud providers)
  slot.querySelector('input[name="activeModel"]').addEventListener('change', e => {
    setActiveModel(e.target.value);
    renderChat();
    overlay.querySelectorAll('.provider-card').forEach(card => {
      card.classList.toggle('active', card.id === 'card-' + e.target.value);
    });
  });

  // Save
  document.getElementById('ollama-save-btn').addEventListener('click', async () => {
    const url = document.getElementById('ollama-url').value.trim() || 'http://localhost:11434/v1';
    const model = document.getElementById('ollama-model').value.trim() || 'llama3.2';
    localStorage.setItem('bizdev-ollama-url', url);
    localStorage.setItem('bizdev-ollama-model', model);
    const statusEl = document.getElementById('status-ollama');
    await testProviderKey('ollama', statusEl);
  });

  // Test
  document.getElementById('ollama-test-btn').addEventListener('click', async () => {
    const url = document.getElementById('ollama-url').value.trim() || 'http://localhost:11434/v1';
    const model = document.getElementById('ollama-model').value.trim() || 'llama3.2';
    localStorage.setItem('bizdev-ollama-url', url);
    localStorage.setItem('bizdev-ollama-model', model);
    const statusEl = document.getElementById('status-ollama');
    await testProviderKey('ollama', statusEl);
  });

  // Setup guide
  document.getElementById('ollama-guide-btn').addEventListener('click', () => openOllamaGuide());
}

    const LANG_NAMES = { en:'English', es:'Español', fr:'Français', de:'Deutsch', it:'Italiano' };

    function getCurrentLang() {
      const saved = localStorage.getItem('bizdev-lang');
      if (saved && TRANSLATIONS[saved]) return saved;
      const nav = (navigator.language || 'en').slice(0, 2).toLowerCase();
      return TRANSLATIONS[nav] ? nav : 'en';
    }
    function setLang(lang) {
      localStorage.setItem('bizdev-lang', lang);
      document.documentElement.lang = lang;
      if (DATA) {
        if (lang !== 'en' && DATA.freelancer.currency !== '€') {
          DATA.freelancer.currency = '€';
          saveData(DATA);
        } else if (lang === 'en' && DATA.freelancer.currency === '€') {
          DATA.freelancer.currency = '£';
          saveData(DATA);
        }
      }
      renderAll();
    }
    function t(key) {
      const lang = getCurrentLang();
      return (TRANSLATIONS[lang]?.[key]) ?? TRANSLATIONS.en[key] ?? key;
    }

    function langSwitcherHTML() {
      const cur = getCurrentLang();
      const opts = Object.keys(TRANSLATIONS)
        .map(l => `<option value="${l}" ${l === cur ? 'selected' : ''}>${LANG_NAMES[l]}</option>`)
        .join('');
      return `<select id="langSwitch" class="btn-sm" style="padding:3px 6px;font-size:11px;" aria-label="${t('language')}">${opts}</select>`;
    }

    // ── end i18n ──────────────────────────────────────────────────────────

    // Trap keyboard focus inside a modal container.
    // Returns a cleanup function; call it when closing.
    function trapFocus(container, onEscape) {
      const FOCUSABLE = 'button:not([disabled]), [href], input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])';
      const getFocusable = () => [...container.querySelectorAll(FOCUSABLE)];
      const trigger = document.activeElement;

      // Focus first element
      const focusable = getFocusable();
      if (focusable.length) focusable[0].focus();

      function onKeyDown(e) {
        if (e.key !== 'Tab') return;
        const els = getFocusable();
        if (!els.length) return;
        const first = els[0];
        const last = els[els.length - 1];
        if (e.shiftKey) {
          if (document.activeElement === first) { e.preventDefault(); last.focus(); }
        } else {
          if (document.activeElement === last) { e.preventDefault(); first.focus(); }
        }
      }

      function onKeyEsc(e) {
        if (e.key === 'Escape') {
          cleanup();
          if (onEscape) {
            onEscape();
          } else {
            container.closest('.modal-overlay')?.remove();
          }
        }
      }

      function cleanup() {
        container.removeEventListener('keydown', onKeyDown);
        document.removeEventListener('keydown', onKeyEsc);
        if (trigger && trigger.focus) trigger.focus();
      }

      container.addEventListener('keydown', onKeyDown);
      document.addEventListener('keydown', onKeyEsc);

      return cleanup;
    }

      s.classList.remove('open');
      s.querySelector('.settings-section-header')?.setAttribute('aria-expanded', 'false');

      section.classList.add('open');
      header.setAttribute('aria-expanded', 'true');
    }

  document.getElementById('settingsImportYes').addEventListener('click', () => {

  });

  document.getElementById('prof-name').value = fl.name || '';
  document.getElementById('prof-role').value = fl.role || '';
  document.getElementById('prof-target').value = fl.annualTarget || '';
  document.getElementById('prof-ytd').value = fl.ytdIncome || '';
  document.getElementById('prof-yearend').value = fl.yearEnd || '';
  if (fl.currency) {
    const sel = document.getElementById('prof-currency');
    [...sel.options].forEach(o => { if (o.value.startsWith(fl.currency)) sel.value = o.value; });
  }
  if (fl.vatRegistered) {
    document.getElementById('prof-vat').checked = true;
    document.getElementById('prof-vatfields').style.display = 'block';
  }
  document.getElementById('prof-vatnum') && (document.getElementById('prof-vatnum').value = fl.vatNumber || '');
  document.getElementById('prof-vatrate') && (document.getElementById('prof-vatrate').value = fl.vatRate || 20);

  document.getElementById('prof-vat').addEventListener('change', e => {
    document.getElementById('prof-vatfields').style.display = e.target.checked ? 'block' : 'none';
  });

  // Populate language selector
  const profLang = document.getElementById('prof-lang');
  if (profLang) profLang.value = getCurrentLang();

  document.getElementById('prof-save').addEventListener('click', () => {
    const name = document.getElementById('prof-name').value.trim();
    const role = document.getElementById('prof-role').value.trim();
    if (!name || !role) return;
    const currencyRaw = document.getElementById('prof-currency').value;
    const selectedLang = document.getElementById('prof-lang')?.value || 'en';
    DATA.freelancer.name = name;
    DATA.freelancer.role = role;
    DATA.freelancer.currency = currencyRaw.split(' ')[0];
    DATA.freelancer.annualTarget = parseFloat(document.getElementById('prof-target').value) || null;
    DATA.freelancer.ytdIncome = parseFloat(document.getElementById('prof-ytd').value) || 0;
    DATA.freelancer.yearEnd = document.getElementById('prof-yearend').value.trim() || DATA.freelancer.yearEnd;
    DATA.freelancer.vatRegistered = document.getElementById('prof-vat').checked;
    if (DATA.freelancer.vatRegistered) {
      DATA.freelancer.vatNumber = document.getElementById('prof-vatnum').value.trim();
      DATA.freelancer.vatRate = parseFloat(document.getElementById('prof-vatrate').value) || 20;
    }
    saveData(DATA);

  });

  // Year End
  document.getElementById('yearEndBtn').addEventListener('click', () => {
    document.getElementById('yearEndConfirm').style.display = 'inline';
    document.getElementById('yearEndBtn').style.display = 'none';
  });
  document.getElementById('yearEndConfirmNo').addEventListener('click', () => {
    document.getElementById('yearEndConfirm').style.display = 'none';
    document.getElementById('yearEndBtn').style.display = '';
  });
  document.getElementById('yearEndConfirmYes').addEventListener('click', () => {
    const yearTotal = DATA.income.actuals.reduce((s, v) => s + v, 0);
    const yearLabel = DATA.freelancer.yearEnd ? `year ending ${DATA.freelancer.yearEnd}` : 'financial year';
    // Reset income for new year
    DATA.income.actuals = Array(12).fill(0);
    DATA.freelancer.ytdIncome = 0;
    // Record closed year in actions as a reminder
    if (!DATA.actions) DATA.actions = [];
    DATA.actions.unshift({
      text: `Financial year closed. Total income: ${DATA.freelancer.currency || '£'}${yearTotal.toLocaleString('en-GB', { minimumFractionDigits: 2, maximumFractionDigits: 2 })} (${yearLabel})`,
      tag: 'Year End',
      urgency: 'normal',
    });
    saveData(DATA);
    renderAll();
    document.getElementById('yearEndConfirm').style.display = 'none';
    const doneEl = document.getElementById('yearEndDone');
    if (doneEl) {
      doneEl.textContent = `Year closed. Final total: ${DATA.freelancer.currency || '£'}${yearTotal.toLocaleString('en-GB', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}. Income reset for new year.`;
      doneEl.style.display = 'block';
    }
  });

  // Danger zone
  document.getElementById('clearLiveDataBtn').addEventListener('click', () => {
    document.getElementById('clearLiveConfirm').style.display = 'inline';
    document.getElementById('clearLiveDataBtn').style.display = 'none';
  });
  document.getElementById('clearLiveConfirmNo').addEventListener('click', () => {
    document.getElementById('clearLiveConfirm').style.display = 'none';
    document.getElementById('clearLiveDataBtn').style.display = '';
  });
  document.getElementById('clearLiveConfirmYes').addEventListener('click', () => {
    localStorage.removeItem('bizdev-data');
    overlay.remove();
    if (localStorage.getItem('bizdev-mode') === 'live') {
      localStorage.setItem('bizdev-mode', 'demo');
      location.reload();
    }
  });
}

        // Step 3 events
        if (step === 3) {
          // Restore action text values (they get reset on re-render)
          document.querySelectorAll('.ob-action-text').forEach(inp => {
            inp.value = actions[parseInt(inp.dataset.i)]?.text || '';
          });
          document.querySelectorAll('.ob-action-urgency').forEach(sel => {
            sel.value = actions[parseInt(sel.dataset.i)]?.urgency || 'normal';
          });

          document.getElementById('ob-back')?.addEventListener('click', () => { step = 2; renderStep(); });
          document.getElementById('ob-add-action')?.addEventListener('click', () => {
            // Capture current values before re-render
            document.querySelectorAll('.ob-action-text').forEach(inp => {
              const i = parseInt(inp.dataset.i);
              if (!actions[i]) actions[i] = { text: '', tag: '', urgency: 'amber' };
              actions[i].text = inp.value.trim();
            });
            document.querySelectorAll('.ob-action-urgency').forEach(sel => {
              const i = parseInt(sel.dataset.i);
              if (actions[i]) actions[i].urgency = sel.value;
            });
            actions.push({ text: '', tag: '', urgency: 'amber' });
            renderStep();
          });
          document.querySelectorAll('.ob-remove-action').forEach(btn => {
            btn.addEventListener('click', () => {
              // Capture current values before removing
              document.querySelectorAll('.ob-action-text').forEach(inp => {
                const i = parseInt(inp.dataset.i);
                if (!actions[i]) actions[i] = { text: '', tag: '', urgency: 'amber' };
                actions[i].text = inp.value.trim();
              });
              document.querySelectorAll('.ob-action-urgency').forEach(sel => {
                const i = parseInt(sel.dataset.i);
                if (actions[i]) actions[i].urgency = sel.value;
              });
              actions.splice(parseInt(btn.dataset.i), 1);
              renderStep();
            });
          });
          document.getElementById('ob-finish').addEventListener('click', () => {
            // Collect final action text/urgency from inputs
            document.querySelectorAll('.ob-action-text').forEach(inp => {
              const i = parseInt(inp.dataset.i);
              if (!actions[i]) actions[i] = { text: '', tag: '', urgency: 'amber' };
              actions[i].text = inp.value.trim();
            });
            document.querySelectorAll('.ob-action-urgency').forEach(sel => {
              const i = parseInt(sel.dataset.i);
              if (actions[i]) actions[i].urgency = sel.value;
            });
            overlay.remove();
            onComplete(onboardingData, actions.filter(a => a.text));
          });
        }
      }

      renderStep();
    }

    function downloadBlob(blob, filename) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename; a.click();
      URL.revokeObjectURL(url);
    }

    function handleExport() {
      const liveRaw = localStorage.getItem('bizdev-data');
      let exportData;
      try { exportData = liveRaw ? JSON.parse(liveRaw) : null; } catch { exportData = null; }
      if (!exportData) return; // button only visible in live mode anyway
      const filename = `bizdev-export-${new Date().toISOString().slice(0, 10)}.json`;
      downloadBlob(new Blob([JSON.stringify(exportData, null, 2)], { type: 'application/json' }), filename);
    }

    function handleExportCsv() {
      const src = getMode() === 'live' ? localStorage.getItem('bizdev-data') : null;
      let d;
      try { d = src ? JSON.parse(src) : DATA; } catch { d = DATA; }
      const currency = d.freelancer?.currency || '£';
      const cols = ['leads', 'proposals', 'active', 'invoiced', 'paid'];
      const colLabels = { leads: 'Lead', proposals: 'Proposal', active: 'Active', invoiced: 'Invoiced', paid: 'Paid' };
      const rows = [['Stage', 'Client', 'Project', `Value (${currency})`, 'Day Rate', 'Notes']];
      cols.forEach(col => {
        (d.pipeline?.[col] || []).forEach(card => {
          rows.push([
            colLabels[col],
            card.client || '',
            card.project || '',
            card.value != null ? card.value : '',
            card.dayRate || '',
            (card.notes || '').replace(/"/g, '""'),
          ]);
        });
      });
      const csv = rows.map(r => r.map(cell => `"${cell}"`).join(',')).join('\r\n');
      const filename = `bizdev-pipeline-${new Date().toISOString().slice(0, 10)}.csv`;
      downloadBlob(new Blob([csv], { type: 'text/csv' }), filename);
    }

    function handleImport(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (ev) => {
        try {
          const parsed = JSON.parse(ev.target.result);
          const requiredKeys = ['freelancer', 'pipeline', 'income', 'capacity', 'actions'];
          if (!requiredKeys.every(k => k in parsed)) throw new Error('schema');
          if (!Array.isArray(parsed.actions) || !Array.isArray(parsed.pipeline?.leads)) throw new Error('schema');

          // Always save to live slot regardless of current mode
          try {
            localStorage.setItem('bizdev-data', JSON.stringify(parsed));
          } catch (storageErr) {
            throw new Error('storage');
          }

          // If currently in live mode, reload DATA and re-render
          if (getMode() === 'live') {
            DATA = parsed;
            localStorage.setItem('bizdev-last-update', 'Live data imported successfully');
            renderAll();
            // Clear the import message after 5 seconds so it doesn't persist on future page loads
            setTimeout(() => {
              if (localStorage.getItem('bizdev-last-update') === 'Live data imported successfully') {
                localStorage.removeItem('bizdev-last-update');
              }
            }, 5000);
          } else {
            // In demo mode — confirm it was saved to live slot
            const statusEl = document.getElementById('settingsImportStatus');
            if (statusEl) { statusEl.style.color = 'var(--teal)'; statusEl.style.display = ''; statusEl.textContent = 'Imported. Switch to Live mode to use it.'; }
          }
        } catch (err) {
          const msg = err.message === 'storage'
            ? "Couldn't save — your browser storage may be full."
            : "That file doesn't look right. Make sure it's a BizDev Dashboard export.";
          const statusEl = document.getElementById('settingsImportStatus');
          if (statusEl) { statusEl.style.color = 'var(--danger)'; statusEl.style.display = ''; statusEl.textContent = msg; }
        }
        e.target.value = '';
      };
      reader.onerror = () => {
        const statusEl = document.getElementById('settingsImportStatus');
        if (statusEl) { statusEl.style.color = 'var(--danger)'; statusEl.style.display = ''; statusEl.textContent = 'Could not read the file.'; }
        e.target.value = '';
      };
      reader.readAsText(file);
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function renderPipeline() {
      const cols = [
        { key: 'leads',    label: t('leads') },
        { key: 'proposals', label: t('proposals') },
        { key: 'active',   label: t('active') },
        { key: 'invoiced', label: t('invoiced') },
        { key: 'paid',     label: t('paid') },
      ];

      const hideFinancials = isHideFinancials();

      const colHTML = cols.map(({ key, label }) => {
        const items = DATA.pipeline[key] || [];
        const total = items.reduce((s, i) => s + (i.value || 0), 0);
        const cards = items.map((item, idx) => `
          <div class="pipeline-card" draggable="true"
            tabindex="0" role="button"
            aria-label="${escapeHtml(item.client || 'Card')} — ${escapeHtml(item.project || '')} (${label})"
            data-col="${key}" data-idx="${idx}">
            <div class="pipeline-card-name">${escapeHtml(item.client || '')}</div>
            <div class="pipeline-card-type">${escapeHtml(item.project || '')}</div>
            ${!hideFinancials ? `<div class="pipeline-card-amount">${fmt(item.value || 0)}</div>` : ''}
            ${item.notes ? `<div class="pipeline-card-type" style="margin-top:4px;font-style:italic;">${escapeHtml(item.notes.slice(0,60))}${item.notes.length>60?'…':''}</div>` : ''}
          </div>
        `).join('');

        return `
          <div class="pipeline-col" data-col="${key}">
            <div class="pipeline-col-header">
              <span class="pipeline-col-title">${label} (${items.length})</span>
              ${!hideFinancials ? `<span class="pipeline-col-value">${fmt(total)}</span>` : ''}
            </div>
            ${cards}
            <button class="pipeline-add-btn" data-col="${key}">${t('addCard')}</button>
          </div>
        `;
      }).join('');

      document.getElementById('pipeline').innerHTML = `
        <h2>${t('pipeline')}</h2>
        <div class="pipeline-cols">${colHTML}</div>
      `;

      // Drag events
      document.querySelectorAll('.pipeline-card').forEach(card => {
        card.addEventListener('dragstart', e => {
          card._isDragging = true;
          card.classList.add('dragging');
          e.dataTransfer.setData('col', card.dataset.col);
          e.dataTransfer.setData('idx', card.dataset.idx);
        });
        card.addEventListener('dragend', () => {
          card.classList.remove('dragging');
          setTimeout(() => { card._isDragging = false; }, 0);
        });
        card.addEventListener('click', () => {
          if (card._isDragging) return;
          openPipelineEdit(card.dataset.col, parseInt(card.dataset.idx));
        });
        card.addEventListener('keydown', e => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            openPipelineEdit(card.dataset.col, parseInt(card.dataset.idx));
          }
        });
      });

      document.querySelectorAll('.pipeline-col').forEach(col => {
        col.addEventListener('dragover', e => { e.preventDefault(); col.classList.add('drag-over'); });
        col.addEventListener('dragleave', () => col.classList.remove('drag-over'));
        col.addEventListener('drop', e => {
          e.preventDefault();
          col.classList.remove('drag-over');
          const fromCol = e.dataTransfer.getData('col');
          const fromIdx = parseInt(e.dataTransfer.getData('idx'));
          const toCol = col.dataset.col;
          if (fromCol === toCol) return;
          const item = DATA.pipeline[fromCol].splice(fromIdx, 1)[0];
          if (!item) return;
          DATA.pipeline[toCol].push(item);
          saveData(DATA);
          renderPipeline();
        });
      });

      // Add buttons
      document.querySelectorAll('.pipeline-add-btn').forEach(btn => {
        btn.addEventListener('click', () => openPipelineEdit(btn.dataset.col, -1));
      });
    }

        : { ...DATA.pipeline[colKey][idx] };

      const colLabels = { leads: 'Lead', proposals: 'Proposal', active: 'Active Project', invoiced: 'Invoiced', paid: 'Paid' };

          </div>
        </div>
      `;

      // Set values safely via DOM (avoids XSS in attribute interpolation)
      document.getElementById('pf-client').value = item.client || '';
      document.getElementById('pf-project').value = item.project || '';
      document.getElementById('pf-value').value = item.value || '';
      document.getElementById('pf-dayrate').value = item.dayRate || '';
      document.getElementById('pf-notes').value = item.notes || '';

      const pipelineModal = overlay.querySelector('.modal');
      const cleanupPipelineFocus = trapFocus(pipelineModal);
      const close = () => { cleanupPipelineFocus(); overlay.remove(); };
      document.getElementById('pipelineClose').addEventListener('click', close);
      document.getElementById('pf-cancel').addEventListener('click', close);
      overlay.addEventListener('click', e => { if (e.target === overlay) close(); });

      if (!isNew) {
        document.getElementById('pf-delete').addEventListener('click', () => {
          document.getElementById('pf-delete-confirm').style.display = 'inline';
          document.getElementById('pf-delete').style.display = 'none';
        });
        document.getElementById('pf-delete-no').addEventListener('click', () => {
          document.getElementById('pf-delete-confirm').style.display = 'none';
          document.getElementById('pf-delete').style.display = '';
        });
        document.getElementById('pf-delete-yes').addEventListener('click', () => {
          DATA.pipeline[colKey].splice(idx, 1);
          saveData(DATA);
          renderPipeline();
          close();
        });

      document.getElementById('pf-save').addEventListener('click', () => {
        const clientInput = document.getElementById('pf-client');
        const client = clientInput.value.trim();
        if (!client) {
          const errEl = document.getElementById('pf-client-error');
          if (errEl) { errEl.textContent = 'Client name is required.'; errEl.classList.add('visible'); }
          clientInput.setAttribute('aria-invalid', 'true');
          clientInput.focus();
          return;
        }
        clientInput.removeAttribute('aria-invalid');
        const updated = {
          client,
          project: document.getElementById('pf-project').value.trim(),
          value: parseFloat(document.getElementById('pf-value').value) || 0,
          dayRate: parseFloat(document.getElementById('pf-dayrate').value) || '',
          notes: document.getElementById('pf-notes').value.trim(),
        };
        if (isNew) {
          DATA.pipeline[colKey].push(updated);
        } else {
          DATA.pipeline[colKey][idx] = { ...DATA.pipeline[colKey][idx], ...updated };

        renderPipeline();
        close();

      const avg = filled.length ? Math.round(filled.reduce((s, v) => s + v, 0) / filled.length) : 0;
      const remainingMonths = 12 - filled.length;
      const projected = ytd + Math.round(avg * remainingMonths);

      const monthInputs = months.map((m, i) => `
        <div class="income-month-input">
          <label for="income-month-${i}">${m}</label>
          <input id="income-month-${i}" type="number" class="income-actual-input" data-idx="${i}" value="${actuals[i] || ''}" placeholder="0" min="0" inputmode="decimal" autocomplete="off">
        </div>

          <div class="stat">
            <div class="stat-label">${t('monthlyAverage')}</div>
            <div class="stat-value">${fmt(avg)}</div>

    function renderCapacity() {
      const { weekHours, loggedHours, byClient } = DATA.capacity;
      const overbooked = loggedHours > weekHours;

      const bars = byClient.map(({ client, hours }) => {
        const clientPct = Math.round((hours / weekHours) * 100);
        return `
          <div class="client-bar-row">
            <div class="client-bar-label">
              <span>${escapeHtml(client)}</span>
              <span>${hours}h</span>
            </div>
            <div class="client-bar-track">
              <div class="client-bar-fill" style="width: ${clientPct}%"></div>
            </div>
          </div>

      }).join('');

      const clients = (DATA.pipeline.active || []).map(c => c.client).filter(Boolean);
      const savedClient = localStorage.getItem('bizdev-timer-client') || '';
      const clientOptions = clients.length
        ? clients.map(c => `<option value="${escapeHtml(c)}" ${c === savedClient ? 'selected' : ''}>${escapeHtml(c)}</option>`).join('')
