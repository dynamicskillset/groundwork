  </script>
  <style>
    :root {
      --bg: #2e3440;
      --surface: #3b4252;
      --border: #4c566a;
      --teal: #88c0d0;
      --teal-text: #88c0d0;
      --teal-light: #2a3d45;
      --amber: #ebcb8b;
      --amber-light: #3d3525;
      --text: #eceff4;
      --muted: #9bb5cc;
      --danger: #bf616a;
      --danger-bg: #3d2020;
      --danger-bg-hover: #4a2828;
      --shadow: 0 1px 3px rgba(0,0,0,0.3), 0 1px 2px rgba(0,0,0,0.2);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: clamp(14px, 1.4vw, 16px);
      line-height: 1.5;
    }

    #app {
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px 16px;
    }

    header {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 20px 24px;
      margin-bottom: 20px;
      box-shadow: var(--shadow);
    }

    main {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    #pipeline { grid-column: 1 / -1; padding: 24px 28px; }

    section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 20px 24px;
      box-shadow: var(--shadow);
    }

    h2 {
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      margin-bottom: 16px;
    }

    h1 {
      font-size: clamp(17px, 2vw, 22px);
      font-weight: 700;
      color: var(--text);
    }

    .meta {
      font-size: 13px;
      color: var(--muted);
      margin-top: 2px;
    }

    .progress-wrap { margin-top: 14px; }
    .progress-label {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      margin-bottom: 6px;
      color: var(--muted);
    }
    .progress-label strong { color: var(--text); }
    .progress-bar {
      height: 8px;
      background: var(--border);
      border-radius: 4px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: var(--teal);
      border-radius: 4px;
      transform-origin: left center;
      transform: scaleX(0);
      transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
      will-change: transform;
    }
    @keyframes target-met-pulse {
      0%, 100% { filter: brightness(1); }
      50%       { filter: brightness(1.25); }
    }
    .progress-fill.target-met {
      background: var(--amber);
      animation: target-met-pulse 3s ease-in-out infinite;
    }
    @keyframes card-pay-flash {
      0%   { background: var(--surface); box-shadow: none; }
      20%  { background: rgba(136,192,208,0.18); box-shadow: 0 0 0 2px rgba(136,192,208,0.45); }
      100% { background: var(--surface); box-shadow: none; }
    }
    .card-just-paid { animation: card-pay-flash 1.1s ease-out forwards; }
    @keyframes status-success-fade {
      0%   { color: var(--teal-text); }
      100% { color: var(--muted); }
    }
    .chat-last-update.just-updated { animation: status-success-fade 2.5s ease-out forwards; }
    .pipeline-empty-hint {
      font-size: 13px;
      color: var(--muted);
      text-align: center;
      padding: 12px 8px 8px;
      line-height: 1.4;
    }

    .pipeline-cols {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 12px;
    }
    .pipeline-col {
      background: var(--bg);
      border-radius: 8px;
      padding: 12px;
    }
    .pipeline-col-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 10px;
    }
    .pipeline-col-title {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
    }
    .pipeline-col-value {
      font-size: 13px;
      font-weight: 700;
      color: var(--teal-text);
    }
    .pipeline-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 10px;
      margin-bottom: 6px;
      font-size: 13px;
    }
    .pipeline-card-name { font-weight: 600; }
    .pipeline-card-type { color: var(--muted); font-size: 13px; }
    .pipeline-card-amount { color: var(--amber); font-weight: 600; font-size: 13px; margin-top: 2px; }

    .income-stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-top: 16px;
    }
    .stat {
      background: var(--bg);
      border-radius: 8px;
      padding: 10px 12px;
    }
    .stat-label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
    .stat-value { font-size: clamp(15px, 1.6vw, 20px); font-weight: 700; color: var(--text); margin-top: 2px; }
    .stat-value.teal { color: var(--teal-text); }

    .income-month-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    .income-month-input label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 3px; }
    .income-month-input input {
      width: 100%;
      padding: 5px 7px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 12px;
    }
    .income-month-input input:focus { outline: 2px solid var(--teal); outline-offset: 1px; }

    .capacity-summary {
      display: flex;
      align-items: baseline;
      gap: 6px;
      margin-bottom: 16px;
    }
    .capacity-hours { font-size: clamp(22px, 2.5vw, 32px); font-weight: 700; color: var(--text); }
    .capacity-of { font-size: 14px; color: var(--muted); }
    .capacity-warning {
      background: var(--danger-bg);
      color: var(--danger);
      border-radius: 4px;
      padding: 2px 8px;
      font-size: 12px;
      font-weight: 600;
      margin-left: auto;
    }
    .client-bar-row { margin-bottom: 10px; }
    .client-bar-label {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      margin-bottom: 4px;
      color: var(--muted);
    }
    .client-bar-label span:first-child { color: var(--text); font-weight: 500; }
    .client-bar-track {
      height: 6px;
      background: var(--border);
      border-radius: 3px;
      overflow: hidden;
    }
    .client-bar-fill {
      height: 100%;
      background: var(--teal);
      border-radius: 3px;
    }

    .action-delete {
      margin-left: auto;
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 16px;
      line-height: 1;
      padding: 6px 8px;
      min-width: 44px;
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.15s;
      flex-shrink: 0;
    }
    .action-item:hover .action-delete,
    .action-delete:focus-visible { opacity: 1; }
    .action-delete:hover { color: var(--danger); }
    .action-item {
      display: flex;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
      align-items: flex-start;
    }
    .action-item:last-child { border-bottom: none; }
    .action-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--teal);
      margin-top: 5px;
      flex-shrink: 0;
    }
    .action-dot.urgent { background: var(--danger); }
    .action-dot.amber { background: var(--amber); }
    .action-text { font-size: 13px; }
    .action-tag {
      display: inline-block;
      font-size: 12px;
      background: var(--teal-light);
      color: var(--teal-text);
      border-radius: 3px;
      padding: 1px 6px;
      margin-top: 3px;
      font-weight: 600;
    }
    .action-tag.amber { background: var(--amber-light); color: var(--amber); }
    .action-tag.red { background: var(--danger-bg); color: var(--danger); }

    /* Chat panel */
    #chat { display: flex; flex-direction: column; gap: 12px; }

    .chat-setup { display: flex; flex-direction: column; gap: 8px; }
    .chat-setup p { font-size: 13px; color: var(--muted); line-height: 1.4; }
    .chat-setup input {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 13px;

/* Panel drag handles */
.panel-drag-handle {
  position: absolute; top: 10px; left: 10px;

  opacity: 0; transition: opacity 0.15s;
  user-select: none;
}
section:hover .panel-drag-handle,
section:focus-within .panel-drag-handle { opacity: 1; }
section { position: relative; }
section.panel-dragging { opacity: 0.5; }
section.panel-drag-over { outline: 2px dashed var(--teal); }
.panel-drag-handle:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; border-radius: 3px; opacity: 1; }

/* Getting started guide */
.guide-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.7);
  z-index: 900;
  pointer-events: none;
}
.guide-tooltip {
  position: fixed;
  background: var(--surface);
  border-radius: 10px;
  padding: 20px;
  max-width: 320px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.2);
  z-index: 920;
  pointer-events: all;
}
.guide-tooltip h4 { font-size: 15px; font-weight: 700; margin-bottom: 8px; }
.guide-body p { font-size: 13px; color: var(--muted); line-height: 1.5; margin-bottom: 10px; }
.guide-body p:last-child { margin-bottom: 14px; }
.guide-nav { display: flex; justify-content: space-between; align-items: center; }
.guide-progress { font-size: 12px; color: var(--muted); }
.guide-highlighted {
  position: relative;
  z-index: 910 !important;
  box-shadow: 0 0 0 4px var(--teal), 0 8px 32px rgba(0,0,0,0.2) !important;
  pointer-events: none;
}

/* Theme dots (used in Settings > Appearance) */
.theme-dot {
  width: 24px; height: 24px; border-radius: 50%;
  cursor: pointer; border: 2px solid transparent;
  transition: transform 0.15s ease-out;
}
.theme-dot:hover { transform: scale(1.15); }
.theme-dot.active { border-color: var(--text); }
/* Settings accordion */
.settings-section { border: 1px solid var(--border); border-radius: 8px; margin-bottom: 8px; overflow: hidden; }
.settings-section-header {
  display: flex; justify-content: space-between; align-items: center;
  width: 100%; padding: 12px 16px; cursor: pointer; font-size: 14px; font-weight: 600;
  background: var(--surface); border: none; color: var(--text); text-align: left;
  font-family: inherit; user-select: none;
}
.settings-section-header:hover { background: var(--bg); }
.settings-section-header:focus-visible { outline: 2px solid var(--teal); outline-offset: -2px; }
.settings-chevron { font-size: 12px; color: var(--muted); transition: transform 0.15s; }
.settings-section.open .settings-chevron { transform: rotate(90deg); }
.settings-section-body {
  display: grid;
  grid-template-rows: 0fr;
  transition: grid-template-rows 0.25s ease-out;
}
.settings-section.open .settings-section-body {
  grid-template-rows: 1fr;
}
.settings-section-body-inner {
  overflow: hidden;
  padding: 0 16px;
  transition: padding 0.25s ease-out, border-color 0.25s;
  border-top: 1px solid transparent;
}
.settings-section.open .settings-section-body-inner {
  padding: 16px;
  border-top-color: var(--border);
}
.danger-header { color: var(--danger); }

/* Provider test status */
.provider-test-status { font-size: 12px; margin-top: 6px; min-height: 16px; }
.provider-test-status.ok { color: var(--teal-text); }
.provider-test-status.fail { color: var(--danger); }
.provider-test-status.pending { color: var(--muted); }
.provider-badge {

.guide-step {

  font-weight: 600;
  text-decoration: none;

}

/* Screen reader only utility */
.sr-only {
  position: absolute;
  width: 1px; height: 1px;
  padding: 0; margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

/* Validation state */
input[aria-invalid="true"],
textarea[aria-invalid="true"] {
  border-color: var(--danger) !important;

}

/* Inline form errors */
.form-error {

}

button:focus-visible,

@media (max-width: 920px) {

    width: 200px;

    scroll-snap-align: start;
  }

@media (max-width: 700px) {
  main {
    grid-template-columns: 1fr;
  }
  .header-top {
    flex-wrap: wrap;
  }
  .header-controls {
    flex-wrap: wrap;
  }

  #pipeline::after {

    color: var(--muted);
    text-align: center;
    margin-top: 6px;

/* Brand */
.app-brand {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 16px;
}
.app-brand-mark { flex-shrink: 0; color: var(--amber); }
.app-brand-name {

  font-weight: 700;
  letter-spacing: 0.08em;

}

/* Footer */
.app-footer {

  padding: 0 4px 8px;

}
.app-footer a { color: var(--muted); text-decoration: underline; text-underline-offset: 2px; }
.app-footer a:hover { color: var(--text); }

/* Reduced motion */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
}

/* High contrast mode */
[data-hc] {
  --bg: #111827;
  --surface: #1a2438;
  --border: #6b7fa0;
  --muted: #c5d2e8;

}

[data-hc] .pipeline-col { border: 1px solid var(--border); }
[data-hc] .pipeline-card { border: 1px solid var(--border); }
[data-hc] *:focus-visible { outline: 3px solid var(--teal); outline-offset: 3px; }

    function loadData() {
      try {
        const saved = localStorage.getItem(storageKey());
        if (!saved) return JSON.parse(JSON.stringify(DEFAULT_DATA));
        const data = JSON.parse(saved);
        // Reset demo data if version has changed
        if (getMode() === 'demo' && data._demoVersion !== DEMO_VERSION) {
          localStorage.removeItem(storageKey());
          return JSON.parse(JSON.stringify(DEFAULT_DATA));
        }
        // Migrate: ensure pipeline has all columns
        if (data.pipeline && !Array.isArray(data.pipeline.paid)) {
          data.pipeline.paid = [];
        }
        // Migrate: ensure projection settings exist
        if (data.freelancer && !data.freelancer.projectionSettings) {
          data.freelancer.projectionSettings = { mode: 'formula', includeLeads: false, includeProposals: true };
        }
        return data;
      } catch {
        return JSON.parse(JSON.stringify(DEFAULT_DATA));
      }
    }

    function saveData(data) {
      try {
        if (getMode() === 'demo') data._demoVersion = DEMO_VERSION;
        localStorage.setItem(storageKey(), JSON.stringify(data));

        if (e.name === 'QuotaExceededError' || e.name === 'NS_ERROR_DOM_QUOTA_REACHED') {

    const ACCENT_COLORS = [

    function wcagLuminance(hex) {
      const lin = c => { c /= 255; return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); };
      return 0.2126 * lin(parseInt(hex.slice(1,3),16)) + 0.7152 * lin(parseInt(hex.slice(3,5),16)) + 0.0722 * lin(parseInt(hex.slice(5,7),16));
    }

    function accentNeedsDarkText(hex) {
      return wcagLuminance(hex) > 0.35;
    }

    function accessibleTextColor(hex) {
      // Returns hex lightened to meet 4.5:1 contrast on --surface (L≈0.051)
      const SURFACE_L = 0.051;
      const needed = 4.5 * (SURFACE_L + 0.05) - 0.05 + 0.002; // ≈ 0.4065, small buffer for fp precision
      const lin = c => { c /= 255; return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); };
      const delin = c => c <= 0.0031308 ? c * 12.92 : 1.055 * Math.pow(c, 1/2.4) - 0.055;
      let lr = lin(parseInt(hex.slice(1,3),16)), lg = lin(parseInt(hex.slice(3,5),16)), lb = lin(parseInt(hex.slice(5,7),16));
      const currentL = 0.2126*lr + 0.7152*lg + 0.0722*lb;
      if (currentL >= needed) return hex;
      const scale = needed / currentL;
      const toHex = c => Math.min(255, Math.round(delin(Math.min(1, c)) * 255)).toString(16).padStart(2, '0');
      return `#${toHex(lr*scale)}${toHex(lg*scale)}${toHex(lb*scale)}`;
    }

    function applyAccent(color) {
      const accent = ACCENT_COLORS.find(a => a.color === color) || ACCENT_COLORS[0];
      const r = document.documentElement.style;
      r.setProperty('--teal', accent.color);
      r.setProperty('--teal-light', accent.light);
      r.setProperty('--teal-text', accessibleTextColor(accent.color));
      r.setProperty('--btn-on-accent', accentNeedsDarkText(accent.color) ? '#2e3440' : '#eceff4');
      localStorage.setItem('bizdev-accent', color);
      if (incomeChart) { incomeChart.destroy(); incomeChart = null; }
      if (document.getElementById('income')?.querySelector('canvas')) {
        renderIncome();
      }
    }

    function applyHighContrast(on) {
      if (on) {

        document.documentElement.removeAttribute('data-hc');
      }
      localStorage.setItem('bizdev-hc', on ? '1' : '');
    }

      return !!localStorage.getItem('bizdev-hc');

    async function testProviderKey(id, statusEl) {
      if (!statusEl) return;
      const apiKey = getProviderKey(id);
      if (!apiKey && id !== 'ollama') {
        statusEl.className = 'provider-test-status fail';
        statusEl.textContent = '✗ No key saved yet';
        return;
      }

      statusEl.className = 'provider-test-status pending';
      statusEl.textContent = 'Testing…';

      try {
        let url, headers, body;

        if (id === 'claude') {
          url = 'https://api.anthropic.com/v1/messages';
          headers = {
            'x-api-key': apiKey,
            'anthropic-version': '2023-06-01',
            'content-type': 'application/json',
            'anthropic-dangerous-allow-browser': 'true',
          };
          body = JSON.stringify({ model: 'claude-haiku-4-5-20251001', max_tokens: 1, messages: [{ role: 'user', content: 'hi' }] });
        } else if (id === 'gemini') {
          url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${encodeURIComponent(apiKey)}`;
          headers = { 'content-type': 'application/json' };
          body = JSON.stringify({ contents: [{ parts: [{ text: 'hi' }] }] });
        } else if (id === 'ollama') {
          const ollamaUrl = localStorage.getItem('bizdev-ollama-url') || 'http://localhost:11434/v1';
          const ollamaModel = localStorage.getItem('bizdev-ollama-model') || 'llama3.2';
          url = ollamaUrl.replace(/\/$/, '') + '/chat/completions';
          headers = { 'content-type': 'application/json' };
          body = JSON.stringify({ model: ollamaModel, max_tokens: 1, messages: [{ role: 'user', content: 'hi' }] });
        } else {
          const urls = { chatgpt: 'https://api.openai.com/v1/chat/completions', mistral: 'https://api.mistral.ai/v1/chat/completions' };
          const models = { chatgpt: 'gpt-4o-mini', mistral: 'mistral-small-latest' };
          url = urls[id];
          headers = { 'Authorization': `Bearer ${apiKey}`, 'content-type': 'application/json' };
          body = JSON.stringify({ model: models[id], max_tokens: 1, messages: [{ role: 'user', content: 'hi' }] });
        }

        const res = await fetch(url, { method: 'POST', headers, body });
        if (res.ok || res.status === 400) {
          statusEl.className = 'provider-test-status ok';
          statusEl.textContent = '✓ Connected';
        } else {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.error?.message || `HTTP ${res.status}`);
        }
      } catch (e) {
        statusEl.className = 'provider-test-status fail';
        statusEl.textContent = `✗ ${e.message.length > 60 ? e.message.slice(0, 57) + '…' : e.message}`;
      }
    }

    const LANG_NAMES = { en:'English', es:'Español', fr:'Français', de:'Deutsch', it:'Italiano' };

    function getCurrentLang() {
      const saved = localStorage.getItem('bizdev-lang');
      if (saved && TRANSLATIONS[saved]) return saved;
      const nav = (navigator.language || 'en').slice(0, 2).toLowerCase();
      return TRANSLATIONS[nav] ? nav : 'en';
    }
    function setLang(lang) {
      localStorage.setItem('bizdev-lang', lang);
      document.documentElement.lang = lang;
      if (DATA) {
        if (lang !== 'en' && DATA.freelancer.currency !== '€') {
          DATA.freelancer.currency = '€';
          saveData(DATA);
        } else if (lang === 'en' && DATA.freelancer.currency === '€') {
          DATA.freelancer.currency = '£';
          saveData(DATA);
        }
      }
      renderAll();
    }
    function t(key) {
      const lang = getCurrentLang();
      return (TRANSLATIONS[lang]?.[key]) ?? TRANSLATIONS.en[key] ?? key;
    }

    function langSwitcherHTML() {
      const cur = getCurrentLang();
      const opts = Object.keys(TRANSLATIONS)
        .map(l => `<option value="${l}" ${l === cur ? 'selected' : ''}>${LANG_NAMES[l]}</option>`)
        .join('');
      return `<select id="langSwitch" class="btn-sm" style="padding:3px 6px;font-size:12px;" aria-label="${t('language')}">${opts}</select>`;
    }

    // ── end i18n ──────────────────────────────────────────────────────────

    // Trap keyboard focus inside a modal container.
    // Returns a cleanup function; call it when closing.
    function trapFocus(container, onEscape) {
      const FOCUSABLE = 'button:not([disabled]), [href], input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])';
      const getFocusable = () => [...container.querySelectorAll(FOCUSABLE)];
      const trigger = document.activeElement;

      // Focus first element
      const focusable = getFocusable();
      if (focusable.length) focusable[0].focus();

      function onKeyDown(e) {
        if (e.key !== 'Tab') return;
        const els = getFocusable();
        if (!els.length) return;
        const first = els[0];
        const last = els[els.length - 1];
        if (e.shiftKey) {
          if (document.activeElement === first) { e.preventDefault(); last.focus(); }
        } else {
          if (document.activeElement === last) { e.preventDefault(); first.focus(); }
        }
      }

      function onKeyEsc(e) {
        if (e.key === 'Escape') {
          cleanup();
          if (onEscape) {
            onEscape();
          } else {
            container.closest('.modal-overlay')?.remove();
          }
        }
      }

      function cleanup() {
        container.removeEventListener('keydown', onKeyDown);
        document.removeEventListener('keydown', onKeyEsc);
        if (trigger && trigger.focus) trigger.focus();
      }

      container.addEventListener('keydown', onKeyDown);
      document.addEventListener('keydown', onKeyEsc);

      return cleanup;
    }

          <span id="clearLiveConfirm" role="alert" style="display:none;margin-left:10px;font-size:12px;">
            Are you sure? This cannot be undone.
            <button class="btn btn-danger" id="clearLiveConfirmYes" style="margin-left:6px;font-size:13px;padding:6px 14px;">Yes, delete everything</button>

    </div>
  `;

  document.body.appendChild(overlay);

  // Accordion — one section open at a time
  const modal = document.getElementById('settingsModal');
  function toggleSettingsSection(header) {
    const section = header.parentElement;
    const isOpen = section.classList.contains('open');
    modal.querySelectorAll('.settings-section').forEach(s => {
      s.classList.remove('open');
      s.querySelector('.settings-section-header')?.setAttribute('aria-expanded', 'false');
    });
    if (!isOpen) {
      section.classList.add('open');
      header.setAttribute('aria-expanded', 'true');
    }
  }
  modal.querySelectorAll('.settings-section-header').forEach(header => {
    header.addEventListener('click', () => toggleSettingsSection(header));
  });

  const cleanupSettingsFocus = trapFocus(modal);
  const closeSettings = () => { cleanupSettingsFocus(); overlay.remove(); };
  document.getElementById('settingsClose').addEventListener('click', closeSettings);
  overlay.addEventListener('click', e => { if (e.target === overlay) closeSettings(); });

  // AI Models: set key values safely via DOM (not innerHTML)
  cloudProviders.forEach(([id]) => {
    const input = document.getElementById('key-' + id);
    if (input) input.value = getProviderKey(id);
  });

  // Save + auto-test
  cloudProviders.forEach(([id]) => {
    document.getElementById('save-' + id).addEventListener('click', async () => {
      const val = document.getElementById('key-' + id).value.trim();
      if (!val) return;
      setProviderKey(id, val);
      await testProviderKey(id, document.getElementById('status-' + id));
    });
    document.getElementById('test-' + id).addEventListener('click', async () => {
      await testProviderKey(id, document.getElementById('status-' + id));
    });
  });

  // Active model radio — in-place highlight update
  modal.querySelectorAll('input[name="activeModel"]').forEach(radio => {
    radio.addEventListener('change', e => {
      setActiveModel(e.target.value);
      renderChat();
      modal.querySelectorAll('.provider-card').forEach(card => {
        card.classList.toggle('active', card.id === 'card-' + e.target.value);
      });
    });
  });

  // Ollama card
  renderOllamaCard(document.getElementById('ollamaCardSlot'), overlay);

  // Accent dots — apply immediately, update active ring in place
  modal.querySelectorAll('.theme-dot').forEach(dot => {
    dot.addEventListener('click', () => {
      applyAccent(dot.dataset.accent);
      modal.querySelectorAll('.theme-dot').forEach(d => {
        d.classList.toggle('active', d.dataset.accent === dot.dataset.accent);
      });
    });
  });

  // High contrast toggle
  document.getElementById('hcToggle').addEventListener('change', e => {
    applyHighContrast(e.target.checked);
    if (incomeChart) { incomeChart.destroy(); incomeChart = null; }
    if (document.getElementById('income')?.querySelector('canvas')) renderIncome();
  });

  // Projection settings — populate text and state
  document.getElementById('proj-title').textContent = t('projectionTitle');
  document.getElementById('proj-desc').textContent = t('projectionDesc');
  document.getElementById('proj-monthly-label').textContent = t('monthlyAverage');
  document.getElementById('proj-monthly-desc').textContent = t('projectionMonthlyDesc');
  document.getElementById('proj-pipeline-label').textContent = t('projectionPipelineLabel');
  document.getElementById('proj-pipeline-desc').textContent = t('projectionPipelineDesc');
  document.getElementById('proj-include-label').textContent = t('projectionInclude');
  document.getElementById('proj-leads-label').textContent = t('leads');
  document.getElementById('proj-proposals-label').textContent = t('proposals');
  document.getElementById('proj-active-label').textContent = t('active') + ' \u2014 ' + t('projectionAlwaysIncluded');
  document.getElementById('proj-invoiced-label').textContent = t('invoiced') + ' \u2014 ' + t('projectionAlwaysIncluded');
  document.getElementById('proj-save').textContent = t('saveBtn');
  document.getElementById('proj-saved-msg').textContent = t('savedConfirm');
  const projSettings = DATA.freelancer.projectionSettings || { mode: 'formula', includeLeads: false, includeProposals: true };
  document.getElementById('proj-mode-' + projSettings.mode).checked = true;
  document.getElementById('proj-inc-leads').checked = !!projSettings.includeLeads;
  document.getElementById('proj-inc-proposals').checked = !!projSettings.includeProposals;
  document.getElementById('proj-pipeline-options').style.display = projSettings.mode === 'pipeline' ? '' : 'none';
  document.querySelectorAll('input[name="projectionMode"]').forEach(radio => {
    radio.addEventListener('change', () => {
      document.getElementById('proj-pipeline-options').style.display = radio.value === 'pipeline' ? '' : 'none';
    });
  });
  document.getElementById('proj-save').addEventListener('click', () => {
    const mode = document.querySelector('input[name="projectionMode"]:checked').value;
    DATA.freelancer.projectionSettings = {
      mode,
      includeLeads: document.getElementById('proj-inc-leads').checked,
      includeProposals: document.getElementById('proj-inc-proposals').checked,
    };
    saveData(DATA);
    renderIncome();
    const msg = document.getElementById('proj-saved-msg');
    msg.style.display = 'inline';
    setTimeout(() => { msg.style.display = 'none'; }, 2000);
  });

  // Export
  document.getElementById('settingsExportBtn').addEventListener('click', handleExport);
  document.getElementById('settingsExportCsvBtn').addEventListener('click', handleExportCsv);

  // Import
  document.getElementById('settingsImportBtn').addEventListener('click', () => {
    document.getElementById('settingsImportConfirm').style.display = 'inline';
    document.getElementById('settingsImportBtn').style.display = 'none';
  });
  document.getElementById('settingsImportNo').addEventListener('click', () => {
    document.getElementById('settingsImportConfirm').style.display = 'none';
    document.getElementById('settingsImportBtn').style.display = '';
  });
  document.getElementById('settingsImportYes').addEventListener('click', () => {
    document.getElementById('settingsImportInput').click();
    document.getElementById('settingsImportConfirm').style.display = 'none';
    document.getElementById('settingsImportBtn').style.display = '';
  });
  document.getElementById('settingsImportInput').addEventListener('change', handleImport);

  // Tour link
  document.getElementById('settingsTourLink').addEventListener('click', e => {
    e.preventDefault();
    overlay.remove();
    startGuide();
  });

  // Profile & Targets — populate fields via DOM
  const fl = DATA.freelancer;
  document.getElementById('prof-name').value = fl.name || '';
  document.getElementById('prof-role').value = fl.role || '';
  document.getElementById('prof-target').value = fl.annualTarget || '';
  document.getElementById('prof-ytd').value = fl.ytdIncome || '';
  document.getElementById('prof-yearend').value = fl.yearEnd || '';
  if (fl.currency) {
    const sel = document.getElementById('prof-currency');
    [...sel.options].forEach(o => { if (o.value.startsWith(fl.currency)) sel.value = o.value; });
  }
  if (fl.vatRegistered) {
    document.getElementById('prof-vat').checked = true;
    document.getElementById('prof-vatfields').style.display = 'block';
  }
  document.getElementById('prof-vatnum') && (document.getElementById('prof-vatnum').value = fl.vatNumber || '');
  document.getElementById('prof-vatrate') && (document.getElementById('prof-vatrate').value = fl.vatRate || 20);

  document.getElementById('prof-vat').addEventListener('change', e => {
    document.getElementById('prof-vatfields').style.display = e.target.checked ? 'block' : 'none';
  });

  // Populate language selector
  const profLang = document.getElementById('prof-lang');
  if (profLang) profLang.value = getCurrentLang();

  document.getElementById('prof-save').addEventListener('click', () => {
    const name = document.getElementById('prof-name').value.trim();
    const role = document.getElementById('prof-role').value.trim();
    if (!name || !role) return;
    const oldFiscalStart = getFiscalStartMonth();
    const currencyRaw = document.getElementById('prof-currency').value;
    const selectedLang = document.getElementById('prof-lang')?.value || 'en';
    DATA.freelancer.name = name;
    DATA.freelancer.role = role;
    DATA.freelancer.currency = currencyRaw.split(' ')[0];
    DATA.freelancer.annualTarget = parseFloat(document.getElementById('prof-target').value) || null;
    DATA.freelancer.ytdIncome = parseFloat(document.getElementById('prof-ytd').value) || 0;
    DATA.freelancer.yearEnd = document.getElementById('prof-yearend').value.trim() || DATA.freelancer.yearEnd;
    DATA.freelancer.vatRegistered = document.getElementById('prof-vat').checked;
    if (DATA.freelancer.vatRegistered) {
      DATA.freelancer.vatNumber = document.getElementById('prof-vatnum').value.trim();
      DATA.freelancer.vatRate = parseFloat(document.getElementById('prof-vatrate').value) || 20;
    }
    const newFiscalStart = getFiscalStartMonth();
    const hasIncomeData = DATA.income.actuals.some(v => v > 0);

    if (newFiscalStart !== oldFiscalStart && hasIncomeData) {
      // Show keep/reset prompt
      const prompt = document.getElementById('fiscal-change-prompt');
      const msg = document.getElementById('fiscal-change-msg');
      const keepBtn = document.getElementById('fiscal-keep-btn');
      const resetBtn = document.getElementById('fiscal-reset-btn');
      if (prompt && msg && keepBtn && resetBtn) {
        msg.textContent = t('fiscalYearChangedMsg');
        keepBtn.textContent = t('fiscalYearKeep');
        resetBtn.textContent = t('fiscalYearReset');
        prompt.style.display = 'block';

        keepBtn.onclick = () => {
          prompt.style.display = 'none';
          saveData(DATA);
          localStorage.setItem('bizdev-lang', selectedLang);
          renderAll();
          const savedEl = document.getElementById('prof-saved');
          if (savedEl) { savedEl.style.display = 'inline'; setTimeout(() => { savedEl.style.display = 'none'; }, 3000); }
        };
        resetBtn.onclick = () => {
          DATA.income.actuals = Array(12).fill(0);
          DATA.freelancer.ytdIncome = 0;
          prompt.style.display = 'none';
          saveData(DATA);
          localStorage.setItem('bizdev-lang', selectedLang);
          renderAll();
          const savedEl = document.getElementById('prof-saved');
          if (savedEl) { savedEl.style.display = 'inline'; setTimeout(() => { savedEl.style.display = 'none'; }, 3000); }
        };
        return; // Don't save yet — wait for user choice
      }
    }

    // No fiscal year change (or no data) — save immediately
    saveData(DATA);
    localStorage.setItem('bizdev-lang', selectedLang);
    renderAll();
    const savedEl = document.getElementById('prof-saved');
    if (savedEl) { savedEl.style.display = 'inline'; setTimeout(() => { savedEl.style.display = 'none'; }, 3000); }
  });

  // Year End
  document.getElementById('yearEndBtn').addEventListener('click', () => {
    document.getElementById('yearEndConfirm').style.display = 'inline';
    document.getElementById('yearEndBtn').style.display = 'none';
  });
  document.getElementById('yearEndConfirmNo').addEventListener('click', () => {
    document.getElementById('yearEndConfirm').style.display = 'none';
    document.getElementById('yearEndBtn').style.display = '';
  });
  document.getElementById('yearEndConfirmYes').addEventListener('click', () => {
    const yearTotal = DATA.income.actuals.reduce((s, v) => s + v, 0);
    const yearLabel = DATA.freelancer.yearEnd ? `year ending ${DATA.freelancer.yearEnd}` : 'financial year';
    // Reset income for new year
    DATA.income.actuals = Array(12).fill(0);
    DATA.freelancer.ytdIncome = 0;
    // Record closed year in actions as a reminder
    if (!DATA.actions) DATA.actions = [];
    DATA.actions.unshift({
      text: `Financial year closed. Total income: ${DATA.freelancer.currency || '£'}${yearTotal.toLocaleString('en-GB', { minimumFractionDigits: 2, maximumFractionDigits: 2 })} (${yearLabel})`,
      tag: 'Year End',
      urgency: 'normal',
    });
    saveData(DATA);
    renderAll();
    document.getElementById('yearEndConfirm').style.display = 'none';
    const doneEl = document.getElementById('yearEndDone');
    if (doneEl) {
      doneEl.textContent = `Year closed. Final total: ${DATA.freelancer.currency || '£'}${yearTotal.toLocaleString('en-GB', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}. Income reset for new year.`;
      doneEl.style.display = 'block';
    }
  });

  // Danger zone
  document.getElementById('clearLiveDataBtn').addEventListener('click', () => {
    document.getElementById('clearLiveConfirm').style.display = 'inline';
    document.getElementById('clearLiveDataBtn').style.display = 'none';
  });
  document.getElementById('clearLiveConfirmNo').addEventListener('click', () => {
    document.getElementById('clearLiveConfirm').style.display = 'none';
    document.getElementById('clearLiveDataBtn').style.display = '';
  });
  document.getElementById('clearLiveConfirmYes').addEventListener('click', () => {
    localStorage.removeItem('bizdev-data');
    overlay.remove();
    if (localStorage.getItem('bizdev-mode') === 'live') {
      localStorage.setItem('bizdev-mode', 'demo');
      location.reload();
    }
  });
}

              ${isDemo ? t('switchToLive') : t('switchToDemo')}

            <button class="btn-sm" id="settingsBtn">&#9881; ${t('settingsBtn')}</button>
            <button class="btn-sm" id="privacyBtn" title="${privacyLabel}" aria-label="${privacyLabel}"
              style="${hidden ? 'color:var(--amber)' : ''}">
              ${privacySymbol}
            </button>
          </div>
        </div>
        ${annualTarget && !hidden ? `
        <div class="progress-wrap">
          <div class="progress-label">
            <span>${t('annualTargetProgress')}</span>
            <span><strong>${fmt(ytdIncome)}</strong> ${t('of')} ${fmt(annualTarget)} &mdash; ${pct}%</span>
          </div>
          <div class="progress-bar" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100" aria-label="${t('annualTargetProgress')}: ${pct}%">
            <div class="progress-fill${pct >= 100 ? ' target-met' : ''}" style="transform: scaleX(${pct / 100})"></div>
          </div>
        </div>
        ` : ''}
      `;

      document.getElementById('modeToggleBtn').addEventListener('click', handleModeToggle);
      document.getElementById('settingsBtn').addEventListener('click', openSettings);
      document.getElementById('privacyBtn').addEventListener('click', () => {
        localStorage.setItem('bizdev-hide-financials', (!hidden).toString());
        renderAll();
      });
      const ls = document.getElementById('langSwitch');
      if (ls) ls.addEventListener('change', e => setLang(e.target.value));
    }

    function handleModeToggle() {
      const newMode = getMode() === 'demo' ? 'live' : 'demo';
      if (newMode === 'live' && !localStorage.getItem('bizdev-data')) {
        startOnboarding((profile, actions) => {
          const currency = profile.currency ? profile.currency.split(' ')[0] : '£';
          const liveData = JSON.parse(JSON.stringify(DEFAULT_DATA));
          liveData.freelancer = {
            name: profile.name,
            role: profile.role,
            currency,
            yearEnd: profile.yearEnd || '05/04',
            annualTarget: profile.annualTarget || null,
            vatRegistered: profile.vatRegistered || false,
            vatNumber: profile.vatNumber || '',
            vatRate: profile.vatRate || 20,
            dayRate: null,
            ytdIncome: 0,
          };
          liveData.pipeline = { leads: [], proposals: [], active: [], invoiced: [], paid: [] };
          liveData.income = { months: DEFAULT_DATA.income.months, actuals: Array(12).fill(0) };
          liveData.capacity = { weekHours: 35, loggedHours: 0, byClient: [] };
          liveData.actions = actions;
          setMode('live');
          DATA = liveData;
          saveData(DATA);
          renderAll();
        });
      } else {
        setMode(newMode);
        DATA = loadData();
        renderAll();
      }
    }

    let onboardingData = {};

    function startOnboarding(onComplete) {
      onboardingData = {};
      let step = 1;
      const actions = [];

      function renderStep() {
        let existing = document.getElementById('onboardingOverlay');
        if (existing) existing.remove();

        const overlay = document.createElement('div');
        overlay.className = 'modal-overlay';
        overlay.id = 'onboardingOverlay';

        const dots = [1,2,3].map(n =>
          `<div class="onboarding-step-dot ${n < step ? 'done' : n === step ? 'active' : ''}"></div>`
        ).join('');

        let content = '';
        if (step === 1) {
          content = `
            <h3>Welcome — tell us about you</h3>
            <div class="onboarding-steps">${dots}</div>
            <div class="onboarding-field">
              <label for="ob-name">Your name</label>
              <input id="ob-name" type="text" placeholder="Alex Morgan" autocomplete="name" aria-describedby="ob-error-1">
            </div>
            <div class="onboarding-field">
              <label for="ob-role">Your role / title</label>
              <input id="ob-role" type="text" placeholder="Digital Strategy Consultant" autocomplete="organization-title" aria-describedby="ob-error-1">
            </div>
            <div class="onboarding-row">
              <div class="onboarding-field">
                <label for="ob-currency">Currency</label>
                <select id="ob-currency">
                  <option>£ GBP</option>
                  <option>$ USD</option>
                  <option>€ EUR</option>
                  <option>$ CAD</option>
                  <option>$ AUD</option>
                </select>
              </div>
              <div class="onboarding-field">
                <label for="ob-yearend">Financial year end</label>
                <input id="ob-yearend" type="text" placeholder="DD/MM e.g. 05/04" inputmode="numeric" pattern="[0-9]{2}/[0-9]{2}" autocomplete="off">
              </div>
            </div>
            <div id="ob-error-1" class="form-error" role="alert"></div>
            <div class="onboarding-nav">
              <span></span>
              <button class="btn btn-primary" id="ob-next">Next &rarr;</button>
            </div>
          `;
        } else if (step === 2) {
          content = `
            <h3>Financial settings</h3>
            <div class="onboarding-steps">${dots}</div>
            <div class="onboarding-field">
              <label for="ob-target">Annual target (optional)</label>
              <input id="ob-target" type="number" placeholder="Leave blank if you don't work to a target" inputmode="numeric" autocomplete="off">
            </div>
            <div class="onboarding-field" style="display:flex;align-items:center;gap:10px;">
              <input type="checkbox" id="ob-vat" style="width:auto;">
              <label for="ob-vat" style="text-transform:none;letter-spacing:0;font-size:14px;font-weight:400;cursor:pointer;">I am VAT registered</label>
            </div>
            <div id="ob-vatfields" style="display:none">
              <div class="onboarding-row">
                <div class="onboarding-field">
                  <label for="ob-vatnum">VAT number</label>
                  <input id="ob-vatnum" type="text" placeholder="GB123456789" autocomplete="off" spellcheck="false">
                </div>
                <div class="onboarding-field">
                  <label for="ob-vatrate">VAT rate (%)</label>
                  <input id="ob-vatrate" type="number" placeholder="20" value="20" inputmode="numeric" autocomplete="off" min="0" max="100">
                </div>
              </div>
            </div>
            <div class="onboarding-nav">
              <button class="btn-sm" id="ob-back">&larr; Back</button>
              <button class="btn btn-primary" id="ob-next">Next &rarr;</button>
            </div>
          `;
        } else {
          const actionRows = actions.map((a, i) => `
            <div class="action-row" data-i="${i}">
              <input type="text" class="ob-action-text" data-i="${i}" placeholder="e.g. Follow up with client X" aria-label="Action ${i + 1}" autocomplete="off">
              <select class="ob-action-urgency" data-i="${i}" aria-label="Priority for action ${i + 1}">
                <option value="urgent">Urgent</option>
                <option value="amber" selected>Medium</option>
                <option value="normal">Normal</option>
              </select>
              <button class="ob-remove-action" data-i="${i}">&times;</button>
            </div>
          `).join('');
          content = `
            <h3>Any immediate actions? <span style="font-weight:400;color:var(--muted)">(optional)</span></h3>
            <div class="onboarding-steps">${dots}</div>
            <div id="ob-actions">${actionRows}</div>
            ${actions.length < 5 ? '<button class="btn-sm" id="ob-add-action">+ Add action</button>' : ''}
            <div class="onboarding-nav">
              <button class="btn-sm" id="ob-back">&larr; Back</button>
              <button class="btn btn-primary" id="ob-finish">Get started &rarr;</button>
            </div>
          `;
        }

        overlay.innerHTML = `<div class="modal">${content}</div>`;
        document.body.appendChild(overlay);
        const onboardingModal = overlay.querySelector('.modal');
        const cleanupOnboardingFocus = trapFocus(onboardingModal);

        // Step 1 events
        if (step === 1) {
          const nameInput = document.getElementById('ob-name');
          const roleInput = document.getElementById('ob-role');
          // Restore previously entered values
          if (onboardingData.name) nameInput.value = onboardingData.name;
          if (onboardingData.role) roleInput.value = onboardingData.role;
          if (onboardingData.currency) {
            const currencySelect = document.getElementById('ob-currency');
            if (currencySelect) currencySelect.value = onboardingData.currency;
          }
          if (onboardingData.yearEnd) {
            const yearEndInput = document.getElementById('ob-yearend');
            if (yearEndInput) yearEndInput.value = onboardingData.yearEnd;
          }
          document.getElementById('ob-next').addEventListener('click', () => {
            const name = nameInput.value.trim();
            const role = roleInput.value.trim();
            if (!name || !role) {
              const errEl = document.getElementById('ob-error-1');
              if (errEl) { errEl.textContent = 'Please enter your name and role.'; errEl.classList.add('visible'); }
              if (!name) { nameInput.setAttribute('aria-invalid', 'true'); nameInput.focus(); }
              else { roleInput.setAttribute('aria-invalid', 'true'); roleInput.focus(); }
              return;
            }
            nameInput.removeAttribute('aria-invalid');
            roleInput.removeAttribute('aria-invalid');
            onboardingData.name = name;
            onboardingData.role = role;
            onboardingData.currency = document.getElementById('ob-currency').value;
            onboardingData.yearEnd = document.getElementById('ob-yearend').value;
            step = 2; renderStep();
          });
        }

        // Step 2 events
        if (step === 2) {
          document.getElementById('ob-vat').addEventListener('change', e => {
            document.getElementById('ob-vatfields').style.display = e.target.checked ? 'block' : 'none';
          });
          document.getElementById('ob-back').addEventListener('click', () => { step = 1; renderStep(); });
          document.getElementById('ob-next').addEventListener('click', () => {
            onboardingData.annualTarget = parseFloat(document.getElementById('ob-target').value) || null;
            onboardingData.vatRegistered = document.getElementById('ob-vat').checked;
            onboardingData.vatNumber = document.getElementById('ob-vatnum')?.value.trim() || '';
            onboardingData.vatRate = parseFloat(document.getElementById('ob-vatrate')?.value) || 20;
            step = 3; renderStep();
          });
        }

        // Step 3 events
        if (step === 3) {
          // Restore action text values (they get reset on re-render)
          document.querySelectorAll('.ob-action-text').forEach(inp => {
            inp.value = actions[parseInt(inp.dataset.i)]?.text || '';
          });
          document.querySelectorAll('.ob-action-urgency').forEach(sel => {
            sel.value = actions[parseInt(sel.dataset.i)]?.urgency || 'normal';
          });

          document.getElementById('ob-back')?.addEventListener('click', () => { step = 2; renderStep(); });
          document.getElementById('ob-add-action')?.addEventListener('click', () => {
            // Capture current values before re-render
            document.querySelectorAll('.ob-action-text').forEach(inp => {
              const i = parseInt(inp.dataset.i);
              if (!actions[i]) actions[i] = { text: '', tag: '', urgency: 'amber' };
              actions[i].text = inp.value.trim();
            });
            document.querySelectorAll('.ob-action-urgency').forEach(sel => {
              const i = parseInt(sel.dataset.i);
              if (actions[i]) actions[i].urgency = sel.value;
            });
            actions.push({ text: '', tag: '', urgency: 'amber' });
            renderStep();
          });
          document.querySelectorAll('.ob-remove-action').forEach(btn => {
            btn.addEventListener('click', () => {
              // Capture current values before removing
              document.querySelectorAll('.ob-action-text').forEach(inp => {
                const i = parseInt(inp.dataset.i);
                if (!actions[i]) actions[i] = { text: '', tag: '', urgency: 'amber' };
                actions[i].text = inp.value.trim();
              });
              document.querySelectorAll('.ob-action-urgency').forEach(sel => {
                const i = parseInt(sel.dataset.i);
                if (actions[i]) actions[i].urgency = sel.value;
              });
              actions.splice(parseInt(btn.dataset.i), 1);
              renderStep();
            });
          });
          document.getElementById('ob-finish').addEventListener('click', () => {
            // Collect final action text/urgency from inputs
            document.querySelectorAll('.ob-action-text').forEach(inp => {
              const i = parseInt(inp.dataset.i);
              if (!actions[i]) actions[i] = { text: '', tag: '', urgency: 'amber' };
              actions[i].text = inp.value.trim();
            });
            document.querySelectorAll('.ob-action-urgency').forEach(sel => {
              const i = parseInt(sel.dataset.i);
              if (actions[i]) actions[i].urgency = sel.value;
            });
            overlay.remove();
            onComplete(onboardingData, actions.filter(a => a.text));
          });
        }
      }

      renderStep();
    }

    function downloadBlob(blob, filename) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename; a.click();
      URL.revokeObjectURL(url);
    }

    function handleExport() {
      const liveRaw = localStorage.getItem('bizdev-data');
      let exportData;
      try { exportData = liveRaw ? JSON.parse(liveRaw) : null; } catch { exportData = null; }
      if (!exportData) return; // button only visible in live mode anyway
      const filename = `bizdev-export-${new Date().toISOString().slice(0, 10)}.json`;
      downloadBlob(new Blob([JSON.stringify(exportData, null, 2)], { type: 'application/json' }), filename);
    }

    function handleExportCsv() {
      const src = getMode() === 'live' ? localStorage.getItem('bizdev-data') : null;
      let d;
      try { d = src ? JSON.parse(src) : DATA; } catch { d = DATA; }
      const currency = d.freelancer?.currency || '£';
      const cols = ['leads', 'proposals', 'active', 'invoiced', 'paid'];
      const colLabels = { leads: 'Lead', proposals: 'Proposal', active: 'Active', invoiced: 'Invoiced', paid: 'Paid' };
      const rows = [['Stage', 'Client', 'Project', `Value (${currency})`, 'Day Rate', 'Notes']];
      cols.forEach(col => {
        (d.pipeline?.[col] || []).forEach(card => {
          rows.push([
            colLabels[col],
            card.client || '',
            card.project || '',
            card.value != null ? card.value : '',
            card.dayRate || '',
            (card.notes || '').replace(/"/g, '""'),
          ]);
        });
      });
      const csv = rows.map(r => r.map(cell => `"${cell}"`).join(',')).join('\r\n');
      const filename = `bizdev-pipeline-${new Date().toISOString().slice(0, 10)}.csv`;
      downloadBlob(new Blob([csv], { type: 'text/csv' }), filename);
    }

    function handleImport(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (ev) => {
        try {
          const parsed = JSON.parse(ev.target.result);
          const requiredKeys = ['freelancer', 'pipeline', 'income', 'capacity', 'actions'];
          if (!requiredKeys.every(k => k in parsed)) throw new Error('schema');
          if (!Array.isArray(parsed.actions) || !Array.isArray(parsed.pipeline?.leads)) throw new Error('schema');

          // Always save to live slot regardless of current mode
          try {
            localStorage.setItem('bizdev-data', JSON.stringify(parsed));
          } catch (storageErr) {
            throw new Error('storage');
          }

          // If currently in live mode, reload DATA and re-render
          if (getMode() === 'live') {
            DATA = parsed;
            localStorage.setItem('bizdev-last-update', 'Live data imported successfully');
            renderAll();
            // Clear the import message after 5 seconds so it doesn't persist on future page loads
            setTimeout(() => {
              if (localStorage.getItem('bizdev-last-update') === 'Live data imported successfully') {
                localStorage.removeItem('bizdev-last-update');
              }
            }, 5000);
          } else {
            // In demo mode — confirm it was saved to live slot
            const statusEl = document.getElementById('settingsImportStatus');
            if (statusEl) { statusEl.style.color = 'var(--teal)'; statusEl.style.display = ''; statusEl.textContent = 'Imported. Switch to Live mode to use it.'; }
          }
        } catch (err) {
          const msg = err.message === 'storage'
            ? "Couldn't save — your browser storage may be full."
            : "That file doesn't look right. Make sure it's a Groundwork export.";
          const statusEl = document.getElementById('settingsImportStatus');
          if (statusEl) { statusEl.style.color = 'var(--danger)'; statusEl.style.display = ''; statusEl.textContent = msg; }
        }
        e.target.value = '';
      };
      reader.onerror = () => {
        const statusEl = document.getElementById('settingsImportStatus');
        if (statusEl) { statusEl.style.color = 'var(--danger)'; statusEl.style.display = ''; statusEl.textContent = 'Could not read the file.'; }
        e.target.value = '';
      };
      reader.readAsText(file);
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function renderPipeline() {
      const cols = [
        { key: 'leads',    label: t('leads') },
        { key: 'proposals', label: t('proposals') },
        { key: 'active',   label: t('active') },
        { key: 'invoiced', label: t('invoiced') },
        { key: 'paid',     label: t('paid') },
      ];

      const hideFinancials = isHideFinancials();

      const colHTML = cols.map(({ key, label }) => {
        const items = DATA.pipeline[key] || [];
        const total = items.reduce((s, i) => s + (i.value || 0), 0);
        const cards = items.map((item, idx) => `
          <div class="pipeline-card" draggable="true"
            tabindex="0" role="button"
            aria-label="${escapeHtml(item.client || 'Card')} — ${escapeHtml(item.project || '')} (${label})"
            data-col="${key}" data-idx="${idx}">
            <div class="pipeline-card-name">${escapeHtml(item.client || '')}</div>
            <div class="pipeline-card-type">${escapeHtml(item.project || '')}</div>
            ${!hideFinancials ? `<div class="pipeline-card-amount">${fmt(item.value || 0)}</div>` : ''}
            ${item.notes ? `<div class="pipeline-card-type" style="margin-top:4px;font-style:italic;">${escapeHtml(item.notes.slice(0,60))}${item.notes.length>60?'…':''}</div>` : ''}
          </div>
        `).join('');

        const emptyHint = items.length === 0
          ? `<p class="pipeline-empty-hint">${key === 'leads' ? 'Add your first lead to get started' : key === 'paid' ? 'Paid work will appear here' : 'Drag cards here'}</p>`
          : '';

        return `
          <div class="pipeline-col" data-col="${key}">
            <div class="pipeline-col-header">
              <span class="pipeline-col-title">${label} (${items.length})</span>
              ${!hideFinancials ? `<span class="pipeline-col-value">${fmt(total)}</span>` : ''}
            </div>
            ${cards}${emptyHint}
            <button class="pipeline-add-btn" data-col="${key}">${t('addCard')}</button>
          </div>
        `;
      }).join('');

      document.getElementById('pipeline').innerHTML = `
        <h2>${t('pipeline')}</h2>
        <div class="pipeline-cols">${colHTML}</div>
      `;

      // Drag events
      document.querySelectorAll('.pipeline-card').forEach(card => {
        card.addEventListener('dragstart', e => {
          card._isDragging = true;
          card.classList.add('dragging');
          e.dataTransfer.setData('col', card.dataset.col);
          e.dataTransfer.setData('idx', card.dataset.idx);
        });
        card.addEventListener('dragend', () => {
          card.classList.remove('dragging');
          setTimeout(() => { card._isDragging = false; }, 0);
        });
        card.addEventListener('click', () => {
          if (card._isDragging) return;
          openPipelineEdit(card.dataset.col, parseInt(card.dataset.idx));
        });
        card.addEventListener('keydown', e => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            openPipelineEdit(card.dataset.col, parseInt(card.dataset.idx));
          }
        });
      });

      document.querySelectorAll('.pipeline-col').forEach(col => {
        col.addEventListener('dragover', e => { e.preventDefault(); col.classList.add('drag-over'); });
        col.addEventListener('dragleave', () => col.classList.remove('drag-over'));
        col.addEventListener('drop', e => {
          e.preventDefault();
          col.classList.remove('drag-over');
          const fromCol = e.dataTransfer.getData('col');
          const fromIdx = parseInt(e.dataTransfer.getData('idx'));
          const toCol = col.dataset.col;
          if (fromCol === toCol) return;
          const item = DATA.pipeline[fromCol].splice(fromIdx, 1)[0];
          if (!item) return;
          DATA.pipeline[toCol].push(item);
          saveData(DATA);
          renderPipeline();
          renderIncome();
          if (toCol === 'paid') {
            const paidCards = document.querySelectorAll('[data-col="paid"] .pipeline-card');
            const last = paidCards[paidCards.length - 1];
            if (last) last.classList.add('card-just-paid');
          }
        });
      });

      // Add buttons
      document.querySelectorAll('.pipeline-add-btn').forEach(btn => {
        btn.addEventListener('click', () => openPipelineEdit(btn.dataset.col, -1));
      });
    }

    function openPipelineEdit(colKey, idx) {
      const isNew = idx === -1;
      const item = isNew
        ? { client: '', project: '', value: 0, dayRate: '', notes: '' }
        : { ...DATA.pipeline[colKey][idx] };

      const colLabels = { leads: 'Lead', proposals: 'Proposal', active: 'Active Project', invoiced: 'Invoiced', paid: 'Paid' };
      const currency = DATA.freelancer.currency || '£';

      const overlay = document.createElement('div');
      overlay.className = 'modal-overlay';
      overlay.innerHTML = `
        <div class="modal pipeline-form">
          <button class="modal-close" aria-label="Close" id="pipelineClose">&times;</button>
          <h3>${isNew ? 'Add ' + colLabels[colKey] : 'Edit ' + colLabels[colKey]}</h3>
          <div class="onboarding-field"><label for="pf-client">Client name</label>
            <input id="pf-client" type="text" aria-describedby="pf-client-error">
            <div id="pf-client-error" class="form-error" role="alert"></div>
          </div>
          <div class="onboarding-field"><label for="pf-project">Project</label>
            <input id="pf-project" type="text"></div>
          <div class="onboarding-row">
            <div class="onboarding-field"><label for="pf-value">Value (${escapeHtml(currency)})</label>
              <input id="pf-value" type="number" min="0" inputmode="numeric" autocomplete="off"></div>
            <div class="onboarding-field"><label for="pf-dayrate">Day rate (optional)</label>
              <input id="pf-dayrate" type="number" min="0" inputmode="numeric" autocomplete="off"></div>
          </div>
          <div class="onboarding-field"><label for="pf-notes">Notes</label>
            <textarea id="pf-notes"></textarea></div>
          <div class="pipeline-modal-footer">
            ${!isNew ? `
              <div style="display:flex;align-items:center;gap:8px;">
                <button class="btn-danger" id="pf-delete">Delete</button>
                <span id="pf-delete-confirm" role="alert" style="display:none;font-size:12px;">
                  Sure?
                  <button class="btn-danger" id="pf-delete-yes" style="margin-left:4px;font-size:13px;padding:6px 12px;">Yes, delete</button>
                  <button class="btn-sm" id="pf-delete-no" style="margin-left:2px;">No</button>
                </span>
              </div>` : '<span></span>'}
            <div style="display:flex;gap:8px;">
              <button class="btn-sm" id="pf-cancel">Cancel</button>
              <button class="btn btn-primary" id="pf-save">Save</button>
            </div>
          </div>
        </div>
      `;
      document.body.appendChild(overlay);

      // Set values safely via DOM (avoids XSS in attribute interpolation)
      document.getElementById('pf-client').value = item.client || '';
      document.getElementById('pf-project').value = item.project || '';
      document.getElementById('pf-value').value = item.value || '';
      document.getElementById('pf-dayrate').value = item.dayRate || '';
      document.getElementById('pf-notes').value = item.notes || '';

      const pipelineModal = overlay.querySelector('.modal');
      const cleanupPipelineFocus = trapFocus(pipelineModal);
      const close = () => { cleanupPipelineFocus(); overlay.remove(); };
      document.getElementById('pipelineClose').addEventListener('click', close);
      document.getElementById('pf-cancel').addEventListener('click', close);
      overlay.addEventListener('click', e => { if (e.target === overlay) close(); });

      if (!isNew) {
        document.getElementById('pf-delete').addEventListener('click', () => {
          document.getElementById('pf-delete-confirm').style.display = 'inline';
          document.getElementById('pf-delete').style.display = 'none';
        });
        document.getElementById('pf-delete-no').addEventListener('click', () => {
          document.getElementById('pf-delete-confirm').style.display = 'none';
          document.getElementById('pf-delete').style.display = '';
        });
        document.getElementById('pf-delete-yes').addEventListener('click', () => {
          DATA.pipeline[colKey].splice(idx, 1);
          saveData(DATA);
          renderPipeline();
          renderIncome();
          close();
        });
      }

      document.getElementById('pf-save').addEventListener('click', () => {
        const clientInput = document.getElementById('pf-client');
        const client = clientInput.value.trim();
        if (!client) {
          const errEl = document.getElementById('pf-client-error');
          if (errEl) { errEl.textContent = 'Client name is required.'; errEl.classList.add('visible'); }
          clientInput.setAttribute('aria-invalid', 'true');
          clientInput.focus();
          return;
        }
        clientInput.removeAttribute('aria-invalid');
        const updated = {
          client,
          project: document.getElementById('pf-project').value.trim(),
          value: parseFloat(document.getElementById('pf-value').value) || 0,
          dayRate: parseFloat(document.getElementById('pf-dayrate').value) || '',
          notes: document.getElementById('pf-notes').value.trim(),
        };
        if (isNew) {
          DATA.pipeline[colKey].push(updated);
        } else {
          DATA.pipeline[colKey][idx] = { ...DATA.pipeline[colKey][idx], ...updated };
        }
        saveData(DATA);
        renderPipeline();
        renderIncome();
        close();
      });
    }

    function renderIncome() {
      if (isHideFinancials()) {
        document.getElementById('income').style.display = 'none';
        return;
      }
      document.getElementById('income').style.display = '';
      const { months, actuals } = DATA.income;
      const fiscalStart = getFiscalStartMonth();
      const rotate = arr => fiscalStart === 0 ? arr : arr.slice(fiscalStart).concat(arr.slice(0, fiscalStart));
      const displayMonths = rotate(months);
      const displayActuals = rotate(actuals);
      const ytd = DATA.freelancer.ytdIncome;
      const filled = actuals.filter(v => v > 0);
      const best = filled.length ? Math.max(...filled) : 0;
      const avg = filled.length ? Math.round(filled.reduce((s, v) => s + v, 0) / filled.length) : 0;
      const remainingMonths = 12 - filled.length;
      const projSettings = DATA.freelancer.projectionSettings || { mode: 'formula', includeLeads: false, includeProposals: true };
      let projected;
      if (projSettings.mode === 'pipeline') {
        const pipeSum = key => (DATA.pipeline[key] || []).reduce((s, i) => s + (i.value || 0), 0);
        projected = ytd + pipeSum('active') + pipeSum('invoiced');
        if (projSettings.includeLeads) projected += pipeSum('leads');
        if (projSettings.includeProposals) projected += pipeSum('proposals');
      } else {
        projected = ytd + Math.round(avg * remainingMonths);
      }

      const monthInputs = displayMonths.map((m, i) => {
        const canonIdx = (fiscalStart + i) % 12;
        return `
          <div class="income-month-input">
            <label for="income-month-${canonIdx}">${m}</label>
            <input id="income-month-${canonIdx}" type="number" class="income-actual-input" data-idx="${canonIdx}" value="${actuals[canonIdx] || ''}" placeholder="0" min="0" inputmode="decimal" autocomplete="off">
          </div>
        `;
      }).join('');

      document.getElementById('income').innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
          <h2 style="margin-bottom:0;">${t('income')}</h2>
          <button class="btn-sm" id="incomeEditToggle" aria-expanded="${incomeEditOpen ? 'true' : 'false'}" aria-controls="incomeMonthGrid">${incomeEditOpen ? t('doneEditing') : t('editIncome')}</button>
        </div>
        <canvas id="incomeChart" height="140" role="img" aria-label="${t('income')} — ${t('monthlyAverage')}: ${fmt(avg)}"></canvas>
        <div class="income-stats">
          <div class="stat">
            <div class="stat-label">${t('ytdTotal')}</div>
            <div class="stat-value teal">${fmt(ytd)}</div>
          </div>
          <div class="stat">
            <div class="stat-label">${t('bestMonth')}</div>
            <div class="stat-value">${fmt(best)}</div>
          </div>
          <div class="stat">
            <div class="stat-label">${t('monthlyAverage')}</div>
            <div class="stat-value">${fmt(avg)}</div>
          </div>
          <div class="stat">
            <div class="stat-label">${t('projectedYearEnd')}</div>
            <div class="stat-value">${fmt(projected)}</div>
          </div>
        </div>
        <div id="incomeEditForm" style="display:${incomeEditOpen ? 'block' : 'none'};margin-top:12px;border-top:1px solid var(--border);padding-top:12px;">
          <div class="income-month-grid" id="incomeMonthGrid">${monthInputs}</div>
        </div>
      `;

      const canvas = document.getElementById('incomeChart');
      if (typeof Chart === 'undefined') {
        canvas.insertAdjacentHTML('afterend', `<p style="color:var(--muted);font-size:13px;margin-top:8px;">${t('chartUnavailable')}</p>`);
        return;
      }

      if (incomeChart) { incomeChart.destroy(); incomeChart = null; }
      incomeChart = new Chart(canvas, {
        type: 'bar',
        data: {
          labels: displayMonths,
          datasets: [{
            data: displayActuals,
            backgroundColor: (() => { const style = getComputedStyle(document.documentElement); const teal = style.getPropertyValue('--teal').trim(); const border = style.getPropertyValue('--border').trim(); return displayActuals.map(v => v > 0 ? teal : border); })(),
            borderRadius: 4,
            borderSkipped: false,
          }]
        },
        options: {
          plugins: { legend: { display: false } },
          scales: {
            x: { grid: { display: false }, ticks: { font: { size: 11 }, color: getComputedStyle(document.documentElement).getPropertyValue('--muted').trim() } },
            y: {
              grid: { color: getComputedStyle(document.documentElement).getPropertyValue('--border').trim() },
              ticks: {
                font: { size: 11 },
                color: getComputedStyle(document.documentElement).getPropertyValue('--muted').trim(),
                callback: v => (DATA.freelancer.currency || '£') + (v / 1000) + 'k'
              }
            }
          }
        }
      });

      // Income edit toggle
      document.getElementById('incomeEditToggle').addEventListener('click', () => {
        incomeEditOpen = !incomeEditOpen;
        renderIncome();
      });

      // Income month inputs — update on change
      document.getElementById('income').querySelectorAll('.income-actual-input').forEach(input => {
        input.addEventListener('change', () => {
          const i = parseInt(input.dataset.idx, 10);
          DATA.income.actuals[i] = parseFloat(input.value) || 0;
          DATA.freelancer.ytdIncome = DATA.income.actuals.reduce((s, v) => s + v, 0);

          </div>
        </div>
      `;

      // Week hours — click to edit inline
      const weekHoursEl = document.getElementById('weekHoursDisplay');
      function activateWeekHoursEdit() {
        const currentVal = DATA.capacity.weekHours;
        const input = document.createElement('input');
        input.type = 'number';
        input.min = '1'; input.max = '168';
        input.value = currentVal;
        input.setAttribute('inputmode', 'numeric');
        input.setAttribute('autocomplete', 'off');
        input.setAttribute('aria-label', t('weekHoursLabel'));
        input.style.cssText = 'width:3.5em;padding:1px 4px;background:var(--bg);border:1px solid var(--teal);border-radius:4px;color:var(--text);font-size:inherit;font-weight:inherit;';
        weekHoursEl.replaceWith(input);
        input.focus(); input.select();
        function commit() {
          const val = parseInt(input.value) || currentVal;
          DATA.capacity.weekHours = Math.max(1, Math.min(168, val));
          saveData(DATA);
          renderCapacity();
        }
        input.addEventListener('blur', commit);
        input.addEventListener('keydown', e => {
          if (e.key === 'Enter') { e.preventDefault(); commit(); }
          if (e.key === 'Escape') { renderCapacity(); }
        });
      }
      weekHoursEl.addEventListener('click', activateWeekHoursEdit);
      weekHoursEl.addEventListener('keydown', e => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); activateWeekHoursEdit(); }
      });

      document.getElementById('logTimeToggle').addEventListener('click', () => {
        const body = document.getElementById('logTimeBody');
        const chevron = document.getElementById('logTimeChevron');
        const toggle = document.getElementById('logTimeToggle');
        const open = body.style.display === 'none';
        body.style.display = open ? 'block' : 'none';
        chevron.style.transform = open ? 'rotate(90deg)' : '';
        toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
      });

      document.getElementById('timerClient').addEventListener('change', e => {
        localStorage.setItem('bizdev-timer-client', e.target.value);
      });

      document.getElementById('timerMinus').addEventListener('click', () => {
        if (timerMinutes > 15) {
          timerMinutes -= 15;
          document.getElementById('timerDurationVal').textContent = fmtDuration(timerMinutes);
        }
      });

      document.getElementById('timerPlus').addEventListener('click', () => {
        timerMinutes += 15;
        document.getElementById('timerDurationVal').textContent = fmtDuration(timerMinutes);
      });

      document.getElementById('timerLogBtn').addEventListener('click', () => {
        const client = document.getElementById('timerClient')?.value || '';
        if (!client) return;
        const hoursToAdd = timerMinutes / 60;
        DATA.capacity.loggedHours = Math.round((DATA.capacity.loggedHours + hoursToAdd) * 10) / 10;
        const existing = DATA.capacity.byClient.find(c => c.client === client);
        if (existing) {
          existing.hours = Math.round((existing.hours + hoursToAdd) * 10) / 10;
        } else {
          DATA.capacity.byClient.push({ client, hours: Math.round(hoursToAdd * 10) / 10 });
        }
        saveData(DATA);
        timerMinutes = 60;
        renderCapacity();
        // Keep the log time section expanded after logging
        document.getElementById('logTimeBody').style.display = 'block';
        document.getElementById('logTimeChevron').style.transform = 'rotate(90deg)';
        document.getElementById('logTimeToggle')?.setAttribute('aria-expanded', 'true');
      });
    }

    }
